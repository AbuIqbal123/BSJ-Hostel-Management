$kind: collection
name: 'Begum Sultan Jahan Hall checks'
description: |-
  Sign in once per role under Auth → Sign in. Each login sets a collection variable
  used as Bearer auth on that role's folders: token_resident, token_warden, token_gate,
  token_provost. Switch roles by signing in as another account; no pasting tokens.

  Resident is Aisha Khan, enrolment 24-GLLB-118. Staff sign-ins: Halima Begum (provost),
  Sara Malik (warden), Fatima Khan (gate).

  Plan an ordinary outing, request a permission, or apply for a guest stay before the
  requests that use outingId, permissionId, or guestStayId. Those Sends save the new id.
variables:
  - key: baseUrl
    value: 'http://localhost:8000'
  - key: residentId
    value: b22de000-0000-4000-8000-000000000002
  - key: userId
    value: a11ce000-0000-4000-8000-000000000001
  - key: blockId
    value: d032aad6-a203-5ea0-ba9a-3a9257edbfc8
  - key: roomId
    value: d4400000-0000-4000-8000-000000000004
  - key: destinationId
    value: fc2da7c5-8d65-5680-8034-d8acb69745eb
  - key: outingId
    value: ''
  - key: permissionId
    value: ''
  - key: guestStayId
    value: ''
  - key: token_resident
    value: ''
  - key: token_warden
    value: ''
  - key: token_gate
    value: ''
  - key: token_provost
    value: ''
