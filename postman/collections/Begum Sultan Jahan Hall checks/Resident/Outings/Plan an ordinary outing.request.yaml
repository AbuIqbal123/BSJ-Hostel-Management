$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/me/outings'
order: 2000
description: |-
  Caller: resident. This is required before an ordinary exit scan. The scan does not ask for a destination or an expected return. She may plan several returns, including two on the same day. Sets destination and expected return. Does not record the exit and does not change whether she is inside. The gate scan does that. No warden approval. Grace is the hall's `grace_minutes` added to the expected return. The expected return must be in the future and inside ordinary hours on that hall date. The start of the window is not included. The end is included. Summer, 1 April through 30 September, is 6:30 AM to 6:30 PM. Winter, 1 October through 31 March, is 6:30 AM to 5:30 PM. A return at or before the start is outside ordinary hours. A return after the end asks her to submit a permission request. A second plan ending at the same instant says she already has an outing ending at that time. When the chosen destination is the Other row, `destination_text` is required. Send fills the next free return at 12:00 PM, then 5:00 PM, then the next day. Both times are inside summer and winter hours. The new outing id is saved for Cancel. Bearer uses {{token_resident}}.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "destination_id": "{{destinationId}}",
      "expected_return_at": "2026-10-01T10:30:00Z"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const token = pm.collectionVariables.get("token_resident");
      if (!token) {
          throw new Error("Sign in as Resident first (sets token_resident).");
      }
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/me/outings",
          method: "GET",
          header: {Authorization: "Bearer " + token}
      }, function (listErr, listRes) {
          const taken = {};
          if (!listErr && listRes && listRes.code === 200) {
              listRes.json().items.forEach(function (item) {
                  taken[item.expected_return_at] = true;
              });
          }
          const now = new Date();
          const slots = [6 * 60 + 30, 11 * 60 + 30];
          let target = null;
          for (let day = 0; day < 14 && target === null; day += 1) {
              const base = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + day);
              for (let slot = 0; slot < slots.length; slot += 1) {
                  const candidate = new Date(base + slots[slot] * 60 * 1000);
                  if (candidate.getTime() <= now.getTime()) {
                      continue;
                  }
                  const iso = candidate.toISOString().replace(".000Z", "Z");
                  if (taken[iso]) {
                      continue;
                  }
                  target = iso;
                  break;
              }
          }
          if (target === null) {
              throw new Error("No free ordinary return in the next two weeks.");
          }
          const payload = JSON.parse(pm.request.body.raw);
          payload.expected_return_at = target;
          pm.request.body.raw = JSON.stringify(payload, null, 2);
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201) {
          pm.collectionVariables.set("outingId", pm.response.json().id);
      }
