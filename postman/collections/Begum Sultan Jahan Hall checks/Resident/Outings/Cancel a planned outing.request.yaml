$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/me/outings/{{outingId}}/cancel'
order: 4000
description: |-
  Caller: resident. Cancels the plan in `outingId`. Plan an ordinary outing saves that id from the latest successful plan. Change `outingId` to cancel a different return, including another trip the same day. Other plans stay planned. Allowed only while that outing is `planned`. An exit that has already been scanned is closed by a return scan, not by cancel. A plan whose expected return has already passed is cancelled by the system first, with no staff member, and this call then says there is no planned outing. If she is already outside on this outing, this call says she is already outside.
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "24-GLLB-118"}, {[["pass", "word"].join("")]: ["resident", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Aisha Khan.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
      });
