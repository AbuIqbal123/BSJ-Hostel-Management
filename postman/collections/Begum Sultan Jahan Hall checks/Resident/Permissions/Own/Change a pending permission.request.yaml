$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/v1/me/permissions/{{permissionId}}'
order: 3500
description: |-
  Caller: resident, and only while this permission is still pending. The kind cannot change. Departure must not be in the past, and the expected return must be after the departure. Home going still requires an address. The permission stays pending. Once it is approved, rejected, cancelled, in use, completed, or expired, this call returns 409 not_editable. Bearer uses {{token_resident}}.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "permission_type": "late_night",
      "short_place": "Library",
      "reason": "The seminar moved.",
      "departure_at": "2026-09-30T15:00:00Z",
      "expected_return_at": "2026-09-30T17:00:00Z"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const now = new Date();
      let departure = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 13, 30, 0));
      if (departure.getTime() <= now.getTime()) {
          departure = new Date(departure.getTime() + 24 * 60 * 60 * 1000);
      }
      const expected = new Date(departure.getTime() + 150 * 60 * 1000);
      const payload = JSON.parse(pm.request.body.raw);
      payload.departure_at = departure.toISOString().replace(".000Z", "Z");
      payload.expected_return_at = expected.toISOString().replace(".000Z", "Z");
      pm.request.body.raw = JSON.stringify(payload, null, 2);

