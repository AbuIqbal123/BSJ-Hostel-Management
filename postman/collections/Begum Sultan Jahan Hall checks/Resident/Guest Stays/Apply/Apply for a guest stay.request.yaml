$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/me/guest-stays'
order: 2000
description: |-
  Caller: resident. Start date must be at least `guest_min_lead_days` after today in Asia/Kolkata (by default, tomorrow or later). Inclusive days from start through end must be within `guest_max_inclusive_days` (by default, 7). Send sets the start to two hall days ahead and the end three days after that, four inclusive days. Payment is not taken here. The new guest stay id is saved for review, payment, arrival, and cancel.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "guest_name": "Zara Ahmed",
      "relation": "Cousin",
      "guest_start_date": "2026-10-18",
      "guest_end_date": "2026-10-21",
      "reason": "Family wedding in Aligarh. Staying with Aisha, B-204."
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const kolkata = new Date(Date.now() + (5 * 60 + 30) * 60 * 1000);
      const start = new Date(Date.UTC(kolkata.getUTCFullYear(), kolkata.getUTCMonth(), kolkata.getUTCDate() + 2));
      const end = new Date(start.getTime() + 3 * 24 * 60 * 60 * 1000);
      const payload = JSON.parse(pm.request.body.raw);
      payload.guest_start_date = start.toISOString().slice(0, 10);
      payload.guest_end_date = end.toISOString().slice(0, 10);
      pm.request.body.raw = JSON.stringify(payload, null, 2);
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201) {
          pm.collectionVariables.set("guestStayId", pm.response.json().id);
      }
