$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/me/history?limit=50&offset=0'
order: 2000
queryParams:
  - key: limit
    value: '50'
  - key: offset
    value: '0'
description: |-
  Caller: resident. Newest first. Each outing contributes an exit line and, once returned, a return line. A gate, warden, or provost account is refused.
