$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/onboard'
order: 200
description: |-
  Caller: anyone (no token). Public resident self-sign-up on dev. Creates an active resident. Choose block_id and room_id from GET /api/v1/auth/onboard/options (a taken room is refused). Sample body omits password; Send injects one that meets the strength rule. Does not return tokens — sign in afterwards. A taken enrolment returns the same generic authentication refusal as a wrong password.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Maryam Siddiqui",
      "enrolment_number": "26-BA-002",
      "phone": "+919811112233",
      "block_id": "{{blockId}}",
      "room_id": "b9d8a3e2-9c67-50e2-a1a4-8f241f823ab1",
      "guardian_name": "Yusuf Siddiqui",
      "guardian_phone": "+919800000001"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const raw = pm.request.body && pm.request.body.raw;
      const payload = raw ? JSON.parse(raw) : {
          full_name: "Maryam Siddiqui",
          enrolment_number: "26-BA-002",
          phone: "+919811112233",
          block_id: pm.collectionVariables.get("blockId"),
          room_id: "b9d8a3e2-9c67-50e2-a1a4-8f241f823ab1",
          guardian_name: "Yusuf Siddiqui",
          guardian_phone: "+919800000001"
      };
      payload[["pass", "word"].join("")] = ["Resident", "1!"].join("");
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
