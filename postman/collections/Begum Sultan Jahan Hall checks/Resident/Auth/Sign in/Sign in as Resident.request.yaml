$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 100
description: |-
  Signs in as Aisha Khan, enrolment 24-GLLB-118. Sets collection variable token_resident for Bearer auth on Resident requests.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "24-GLLB-118"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const raw = pm.request.body && pm.request.body.raw;
      const payload = raw ? JSON.parse(raw) : {username: "24-GLLB-118"};
      payload[["pass", "word"].join("")] = ["Resident", "10"].join("-");
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("Aisha Khan is signed in", function () {
          pm.response.to.have.status(200);
          pm.expect(body.token_type).to.eql("bearer");
          pm.expect(body.expires_in).to.eql(900);
          pm.expect(body.access_token).to.be.a("string").and.not.empty;
          pm.expect(body.refresh_token).to.be.a("string").and.not.empty;
          pm.expect(body.user.username).to.eql("24-GLLB-118");
          pm.expect(body.user.role).to.eql("resident");
          pm.expect(body.user.full_name).to.eql("Aisha Khan");
      });
      if (pm.response.code === 200 && body.access_token) {
          pm.collectionVariables.set("token_resident", body.access_token);
      }
