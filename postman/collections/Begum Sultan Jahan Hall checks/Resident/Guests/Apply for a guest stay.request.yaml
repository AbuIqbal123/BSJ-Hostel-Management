$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/me/guest-stays'
order: 2000
description: |-
  Caller: resident. Start date must be at least `guest_min_lead_days` after today in Asia/Kolkata (by default, tomorrow or later). Inclusive days from start through end must be within `guest_max_inclusive_days` (by default, 7). Friday 18 September through Monday 21 September is 4 days. Payment is not taken here. Returns 404 until this route is built.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "guest_name": "Zara Ahmed",
      "relation": "Cousin",
      "start_date": "2026-10-18",
      "end_date": "2026-10-21",
      "reason": "Family wedding in Aligarh. Staying with Aisha, B-204."
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "24-GLLB-118"}, {[["pass", "word"].join("")]: ["resident", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Aisha Khan.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
      });
