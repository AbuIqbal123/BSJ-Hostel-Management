$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/me/hall-pass'
order: 1000
description: |-
  Caller: resident. Returns the payload the phone encodes as a QR image. The same payload is used to leave and to come back. It changes only when the provost reissues it. A gate, warden, or provost account is refused.
