$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/me/hall-pass'
order: 1000
description: |-
  Caller: resident. Returns the payload the phone encodes as a QR image. The same payload is used to leave and to come back. It changes only when the provost reissues it. Returns 404 until this route is built.
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify({username: "24-GLLB-118", password: ""})
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Aisha Khan.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
      });
