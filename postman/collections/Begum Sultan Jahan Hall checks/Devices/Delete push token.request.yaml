$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/v1/devices/push-token'
order: 2000
description: |-
  Caller: any signed-in account. Call before sign-out. Deletes the token only
  if the caller holds it. Idempotent: 204 either way.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
    }
