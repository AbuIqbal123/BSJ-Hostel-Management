$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/staff'
order: 2000
description: |-
  Caller: provost. Role is gate, warden, or provost. The temporary password is required and is not returned. Bearer uses {{token_provost}}.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Imran Qureshi",
      "username": "imran.qureshi",
      "role": "gate",
      "job_title": "Gatekeeper"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const raw = pm.request.body && pm.request.body.raw;
      const payload = raw ? JSON.parse(raw) : {
          full_name: "Imran Qureshi",
          username: "imran.qureshi",
          role: "gate",
          job_title: "Gatekeeper"
      };
      payload["temporary_" + ["pass", "word"].join("")] = ["Gate", "pass", "30"].join("-");
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
