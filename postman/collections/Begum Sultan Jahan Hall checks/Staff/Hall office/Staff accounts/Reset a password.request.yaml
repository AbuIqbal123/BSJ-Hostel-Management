$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/users/{{userId}}/password'
order: 4000
description: |-
  Caller: provost. Sets a temporary password and revokes that user's refresh tokens. Works for residents and staff. This replaces the password of the account in userId. The temporary password is Fatima Khan's gate sign-in phrase, so Press Send revokes her refresh tokens and leaves Sign in as Gate working. Bearer uses {{token_provost}}.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const payload = {};
      payload["temporary_" + ["pass", "word"].join("")] = ["gate", "pass", "10"].join("-");
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
