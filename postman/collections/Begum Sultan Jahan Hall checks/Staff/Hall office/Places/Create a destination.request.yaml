$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/destinations'
order: 8000
description: |-
  Caller: provost. Only one active destination may have `is_other` true.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Sample destination",
      "is_other": false
    }
