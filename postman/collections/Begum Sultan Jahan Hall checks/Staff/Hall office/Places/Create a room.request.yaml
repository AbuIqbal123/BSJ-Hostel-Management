$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/rooms'
order: 5000
description: |-
  Caller: provost. `label` is stored as `{block code}-{number}`. The number is text, so `087` stays `087`. The hall page does not publish door numbers. This sample uses door 205 in Block-B. Returns 404 until this route is built.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "block_id": "{{blockId}}",
      "number": "205"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify({username: "provost.halima", password: ""})
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
