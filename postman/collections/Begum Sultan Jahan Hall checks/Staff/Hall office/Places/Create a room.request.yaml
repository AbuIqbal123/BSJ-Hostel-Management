$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/rooms'
order: 5000
description: |-
  Caller: provost. `label` is stored as `{block code}-{number}`. The number is text, so `087` stays `087`. The hall page does not publish door numbers. This sample uses door 205 in Block-B.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "block_id": "{{blockId}}",
      "number": "205"
    }
