$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/blocks'
order: 2000
description: |-
  Caller: provost. `code` is the short label used in room names, such as B. The published hall has no Block-E. This is a sample body for the request. Returns 404 until this route is built.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "E",
      "name": "Block-E",
      "floors": 4,
      "room_count": 1,
      "beds_per_room": 2
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify({username: "provost.halima", password: ""})
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
