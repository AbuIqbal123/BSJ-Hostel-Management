$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/blocks'
order: 2000
description: |-
  Caller: provost. `code` is the short label used in room names, such as B. The published hall has no Block-E. This is a sample body for the request.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "E",
      "name": "Block-E",
      "floors": 4,
      "room_count": 1,
      "beds_per_room": 2
    }
