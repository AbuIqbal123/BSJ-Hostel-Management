$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/v1/admin/residents/{{residentId}}'
order: 4000
description: |-
  Caller: provost. Send only the fields that change. `course` may be set to null to clear it. `guardian_name` and `guardian_phone` may be replaced and may not be cleared. A phone includes the country code. Changing `enrolment_number` changes the username. `status` suspends or reinstates the account and revokes refresh tokens on suspension.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "course": "B.A. LL.B. (Hons.)"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "provost.halima"}, {[["pass", "word"].join("")]: ["provost", "pass", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
