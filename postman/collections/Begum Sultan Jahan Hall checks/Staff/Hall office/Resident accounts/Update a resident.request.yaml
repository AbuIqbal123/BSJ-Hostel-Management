$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/v1/admin/residents/{{residentId}}'
order: 4000
description: |-
  Caller: provost. Send only the fields that change. Name, enrolment number, and
  course are set at create or onboard and are refused here. `phone` may be set to
  null to clear it. `guardian_name` and `guardian_phone` may be replaced and may
  not be cleared. A phone includes the country code. `status` suspends or
  reinstates the account and revokes refresh tokens on suspension.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "+919811112222",
      "status": "active"
    }
