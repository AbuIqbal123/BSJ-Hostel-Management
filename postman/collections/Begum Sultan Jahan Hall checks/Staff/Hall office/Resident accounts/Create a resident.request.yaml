$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/admin/residents'
order: 2000
description: |-
  Caller: provost. Username is the enrolment number. The response includes the hall pass payload once, so the office can place it on the resident's phone. Later reads of the account do not return the token. Room B-204 already has Aisha Khan. This sample is a second resident for that room. Bearer uses {{token_provost}}.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Maryam Siddiqui",
      "enrolment_number": "26-BA-001",
      "course": "B.A.",
      "room_id": "{{roomId}}",
      "phone": "+919811112222",
      "guardian_name": "Yusuf Siddiqui",
      "guardian_phone": "+919800000001"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const raw = pm.request.body && pm.request.body.raw;
      const payload = raw ? JSON.parse(raw) : {
          full_name: "Maryam Siddiqui",
          enrolment_number: "26-BA-001",
          course: "B.A.",
          room_id: pm.collectionVariables.get("roomId"),
          phone: "+919811112222",
          guardian_name: "Yusuf Siddiqui",
          guardian_phone: "+919800000001"
      };
      payload["temporary_" + ["pass", "word"].join("")] = ["resident", "20"].join("-");
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
