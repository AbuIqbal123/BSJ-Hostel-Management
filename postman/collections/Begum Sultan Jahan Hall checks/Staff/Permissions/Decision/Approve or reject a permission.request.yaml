$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/permissions/{{permissionId}}/decision'
order: 7000
description: |-
  Caller: warden or provost. Only a `pending` permission can be decided. A second decision returns 409 `not_pending` and names the current status. Approval does not create an outing and does not by itself let a scan succeed before the use window. Rejection leaves ordinary outings available.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "decision": "approved"
    }
