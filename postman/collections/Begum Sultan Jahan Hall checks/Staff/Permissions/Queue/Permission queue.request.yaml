$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/permissions?status=pending&order=newest&limit=50&offset=0'
order: 5000
queryParams:
  - key: status
    value: pending
  - key: permission_type
    value: ''
    description: Optional. late_night or home_going.
    disabled: true
  - key: block_id
    value: ''
    description: Optional. Resident's current-room block.
    disabled: true
  - key: created_from
    value: ''
    description: Optional inclusive UTC lower bound on created_at.
    disabled: true
  - key: created_to
    value: ''
    description: Optional inclusive UTC upper bound on created_at.
    disabled: true
  - key: q
    value: ''
    description: Optional. Resident name or room label.
    disabled: true
  - key: order
    value: newest
    description: newest (default), oldest by created_at, or departure by departure_at.
  - key: limit
    value: '50'
  - key: offset
    value: '0'
description: |-
  Caller: warden or provost. Defaults to `pending`. Ordered by `created_at`
  (`order=newest` or `oldest`) or by departure (`order=departure`). Optional
  filters: `permission_type`, `block_id`, `created_from`, `created_to`, `q`.
  This list does not expire passed permissions; call expire-passed.
