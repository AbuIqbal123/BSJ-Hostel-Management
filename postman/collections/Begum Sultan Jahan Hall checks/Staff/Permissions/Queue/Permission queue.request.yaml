$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/permissions?status=pending&order=newest&limit=50&offset=0'
order: 5000
queryParams:
  - key: status
    value: pending
  - key: type
    value: ''
    description: Optional. late_night or home_going.
    disabled: true
  - key: block_id
    value: ''
    description: Optional. Resident's current-room block.
    disabled: true
  - key: created_from
    value: ''
    description: Optional inclusive UTC lower bound on created_at.
    disabled: true
  - key: created_to
    value: ''
    description: Optional inclusive UTC upper bound on created_at.
    disabled: true
  - key: order
    value: newest
    description: newest (default) or oldest by created_at.
  - key: limit
    value: '50'
  - key: offset
    value: '0'
description: |-
  Caller: warden or provost. Defaults to `pending`. Ordered by `created_at` (`order=newest` or `oldest`). Optional filters: `type`, `block_id`, `created_from`, `created_to`. An approved permission whose expected return has passed, and which was never used, becomes `expired` when this list is read.
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "provost.halima"}, {[["pass", "word"].join("")]: ["provost", "pass", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
