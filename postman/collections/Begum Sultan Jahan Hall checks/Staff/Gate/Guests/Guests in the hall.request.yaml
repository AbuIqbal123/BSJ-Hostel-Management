$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/gate/guests?bucket=in_hall'
order: 3500
queryParams:
  - key: bucket
    value: in_hall
description: |-
  Caller: gate, warden, or provost. `expected` is approved, paid, not yet arrived, and the hall date is inside the stay. `in_hall` includes guests who should already have left, because departure is still recorded here.
