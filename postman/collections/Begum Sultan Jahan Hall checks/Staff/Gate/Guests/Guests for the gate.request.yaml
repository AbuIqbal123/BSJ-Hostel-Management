$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/gate/guests?bucket=expected'
order: 3000
queryParams:
  - key: bucket
    value: expected
  - key: payment_status
    value: ''
    description: Optional. paid or unpaid. Left off so Press Send does not send an empty value.
    disabled: true
description: |-
  Caller: gate, warden, or provost. Buckets are timing-based. `expected` is approved, not yet arrived, and the hall date is inside the stay. `in_hall` includes guests who should already have left. Optional `payment_status` (`paid` or `unpaid`) filters payment; omit for every guest in the bucket.
