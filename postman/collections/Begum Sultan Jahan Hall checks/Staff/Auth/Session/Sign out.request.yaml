$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/logout'
order: 500
description: |-
  Signs out the account for Bearer {{token_provost}} (Sign in as Provost first). Revokes that account's refresh tokens.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("signed out", function () {
          pm.response.to.have.status(204);
          pm.expect(pm.response.text()).to.eql("");
      });
