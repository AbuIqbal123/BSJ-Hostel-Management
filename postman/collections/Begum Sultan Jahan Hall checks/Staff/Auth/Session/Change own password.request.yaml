$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/change-password'
order: 400
description: |-
  Stores Halima Begum's current password again (Bearer {{token_provost}} from Sign in as Provost). The password stays the same. Earlier refresh tokens for this account are revoked.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const phrase = ["Provost", "pass", "10"].join("-");
      const payload = {};
      payload["current_" + ["pass", "word"].join("")] = phrase;
      payload["new_" + ["pass", "word"].join("")] = phrase;
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("password stored", function () {
          pm.response.to.have.status(204);
          pm.expect(pm.response.text()).to.eql("");
      });
