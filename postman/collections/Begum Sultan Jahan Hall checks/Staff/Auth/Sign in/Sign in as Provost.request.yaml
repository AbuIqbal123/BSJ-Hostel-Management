$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 100
description: |-
  Signs in as Halima Begum, the provost. Sets collection variable token_provost for Bearer auth on Staff requests (default).
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "provost.halima"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const raw = pm.request.body && pm.request.body.raw;
      const payload = raw ? JSON.parse(raw) : {username: "provost.halima"};
      payload[["pass", "word"].join("")] = ["Provost", "pass", "10"].join("-");
      pm.request.body.update({
          mode: "raw",
          raw: JSON.stringify(payload),
          options: {raw: {language: "json"}}
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("Halima Begum is signed in", function () {
          pm.response.to.have.status(200);
          pm.expect(body.token_type).to.eql("bearer");
          pm.expect(body.expires_in).to.eql(900);
          pm.expect(body.access_token).to.be.a("string").and.not.empty;
          pm.expect(body.refresh_token).to.be.a("string").and.not.empty;
          pm.expect(body.user.username).to.eql("provost.halima");
          pm.expect(body.user.role).to.eql("provost");
          pm.expect(body.user.full_name).to.eql("Halima Begum");
      });
      if (pm.response.code === 200 && body.access_token) {
          pm.collectionVariables.set("token_provost", body.access_token);
      }
