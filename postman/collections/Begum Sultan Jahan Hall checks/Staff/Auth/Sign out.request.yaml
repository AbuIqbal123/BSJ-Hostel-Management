$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/logout'
order: 500
description: |-
  Signs in as Halima Begum and then signs her out. The refresh token from that sign-in is revoked. The next Send signs in again.
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "provost.halima"}, {[["pass", "word"].join("")]: ["provost", "pass", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("signed out", function () {
          pm.response.to.have.status(204);
          pm.expect(pm.response.text()).to.eql("");
      });
