$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/guest-stays/{{guestStayId}}/payment'
order: 11000
description: |-
  Caller: warden or provost. Records that the hall office has or has not taken payment. Allowed before arrival, whether the stay is pending or approved. The app does not collect money.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "payment_status": "paid"
    }
