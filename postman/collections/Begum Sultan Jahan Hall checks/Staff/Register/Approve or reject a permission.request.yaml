$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/permissions/{{permissionId}}/decision'
order: 7000
description: |-
  Caller: warden or provost. Only a `pending` permission can be decided. Approval does not create an outing and does not by itself let a scan succeed before the use window. Rejection leaves ordinary outings available.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "decision": "approved"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "provost.halima"}, {[["pass", "word"].join("")]: ["provost", "pass", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
