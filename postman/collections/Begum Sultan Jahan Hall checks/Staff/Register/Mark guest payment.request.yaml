$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/guest-stays/{{guestStayId}}/payment'
order: 11000
description: |-
  Caller: warden or provost. Records that the hall office has or has not taken payment. Allowed before arrival, whether the stay is pending or approved. The app does not collect money. Returns 404 until this route is built.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "payment_status": "paid"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify({username: "provost.halima", password: ""})
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
