$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/register/summary'
order: 1000
description: |-
  Caller: warden or provost. Counts for the whole hall and the same counts for
  each block: active residents inside, outside before grace, or late after grace;
  permissions waiting; guests in hall; guests who should have left; and guest
  stays waiting. A resident and a waiting permission count in the block of the
  resident's current room. A guest counts in the host's block. Suspended
  residents are left out of the inside and outside counts. Hall totals are the
  sum of the block counts.
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "provost.halima"}, {[["pass", "word"].join("")]: ["provost", "pass", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
