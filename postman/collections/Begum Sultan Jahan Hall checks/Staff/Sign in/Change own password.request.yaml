$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/change-password'
order: 400
description: |-
  Signs in as Halima Begum and stores her password again as . The password stays the same, so the next Send still signs in. Earlier refresh tokens for this account are revoked.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "",
      "new_password": ""
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify({username: "provost.halima", password: ""})
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("password stored", function () {
          pm.response.to.have.status(204);
          pm.expect(pm.response.text()).to.eql("");
      });
