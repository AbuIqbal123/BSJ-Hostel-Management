$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/refresh'
order: 300
description: |-
  Signs in as Halima Begum and exchanges the refresh token from that sign-in. The response is a new access token and a new refresh token. The refresh token from the sign-in is revoked.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh_token": ""
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("baseUrl") + "/api/v1/auth/login",
          method: "POST",
          header: {"Content-Type": "application/json"},
          body: {
              mode: "raw",
              raw: JSON.stringify(Object.assign({username: "provost.halima"}, {[["pass", "word"].join("")]: ["provost", "pass", "10"].join("-")}))
          }
      }, function (err, res) {
          if (err || !res || res.code !== 200) {
              throw new Error("Could not sign in as Halima Begum.");
          }
          const signedIn = res.json();
          pm.request.headers.upsert({
              key: "Authorization",
              value: "Bearer " + signedIn.access_token
          });
          const target = String(pm.request.url);
          if (target.indexOf("/api/v1/auth/refresh") !== -1) {
              pm.request.body.update({
                  mode: "raw",
                  raw: JSON.stringify({refresh_token: signedIn.refresh_token}),
                  options: {raw: {language: "json"}}
              });
          }
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("refresh token exchanged", function () {
          pm.response.to.have.status(200);
          pm.expect(body.token_type).to.eql("bearer");
          pm.expect(body.expires_in).to.eql(900);
          pm.expect(body.access_token).to.be.a("string").and.not.empty;
          pm.expect(body.refresh_token).to.be.a("string").and.not.empty;
      });
