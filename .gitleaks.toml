# Extends the default rules. Firebase Android client config is public by design
# (restricted by package name); the FCM service account stays out of the repo.
title = "bsj-hostel-management"

[extend]
useDefault = true

[[allowlists]]
description = "Firebase Android client config (public; package-restricted API key)"
paths = [
  '''(^|/)mobile/google-services\.json$''',
]
