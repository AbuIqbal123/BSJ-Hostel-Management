name: Checks

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Run checks
        run: |
          export APP_SECRET_KEY="$(python -c 'print("".join(("hall", "-test-", "signing-", "key-", "0123456789abcdef")))')"
          pytest -q
        env:
          ENVIRONMENT: development
          SMS_DRIVER: mock
