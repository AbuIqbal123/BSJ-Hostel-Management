name: Checks

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Docs guards
        run: python scripts/check_docs.py
      - name: Run checks
        run: |
          export APP_SECRET_KEY="$(python -c 'from app.shared.testing_env import signing_key_for_tests; print(signing_key_for_tests())')"
          pytest -q
        env:
          ENVIRONMENT: development
          SMS_DRIVER: mock

  mobile:
    name: Mobile typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci
      - name: Expo doctor
        run: npx expo-doctor

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the Releases API asset URL. The public browser_download_url
          # often 504s from Actions while the authenticated asset endpoint works.
          asset_url="$(gh api repos/gitleaks/gitleaks/releases/tags/v8.30.1 \
            --jq '.assets[] | select(.name == "gitleaks_8.30.1_linux_x64.tar.gz") | .url')"
          curl -fsSL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o /tmp/gitleaks.tgz \
            "$asset_url"
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tgz gitleaks
          gitleaks version
      - name: Scan the tree
        run: gitleaks detect --redact --no-banner --no-git --source .
