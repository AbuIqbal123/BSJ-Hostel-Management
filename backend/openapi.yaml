        destination_detail:
          type: string
          minLength: 1
          maxLength: 120
        reason:
          type: string
          minLength: 1
          maxLength: 500
        departure_at:
          type: string
          format: date-time
        expected_return_at:
          type: string
          format: date-time

    HomeGoingCreate:
      type: object
      additionalProperties: false
      required: [permission_type, short_place, address, reason, departure_at, expected_return_at]
      properties:
        permission_type:
          type: string
          const: home_going
        short_place:
          type: string
          minLength: 1
          maxLength: 120
          description: Short place on the warden card, such as Lucknow.
        address:
          type: string
          minLength: 1
          maxLength: 300
        reason:
          type: string
          minLength: 1
          maxLength: 500
        departure_at:
          type: string
          format: date-time
        expected_return_at:
          type: string
          format: date-time

    Permission:
      type: object
      additionalProperties: false
      required:
