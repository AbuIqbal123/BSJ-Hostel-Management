    ExpirePassedResult:
      type: object
      additionalProperties: false
      required: [plans_expired, permissions_expired]
      properties:
        plans_expired:
          type: integer
          minimum: 0
          description: Planned ordinary outings cancelled because expected return passed.
        permissions_expired:
          type: integer
          minimum: 0
          description: Unused approved permissions marked expired.

    ExpirePassedPermissionsResult:
      type: object
      additionalProperties: false
      required: [permissions_expired]
      properties:
        permissions_expired:
          type: integer
          minimum: 0
          description: Unused approved permissions marked expired.

    PermissionType:
      type: string
      enum: [late_night, home_going]

    PermissionStatus:
      type: string
      enum: [pending, approved, rejected, cancelled, in_use, completed, expired]

    PermissionCreate:
      oneOf:
        - $ref: "#/components/schemas/LateNightCreate"
        - $ref: "#/components/schemas/HomeGoingCreate"
