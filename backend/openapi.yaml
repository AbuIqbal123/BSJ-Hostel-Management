                    items:
                      - event: exit
                        occurred_at: "2026-09-13T14:39:00Z"
                        resident_name: Zoya Siddiqui
                        room_label: A-118
                        guest_name: null
                        host_name: null
                        host_room_label: null
                guest_arrival:
                  summary: Guest arrival
                  value:
                    total: 3
                    limit: 50
                    offset: 0
                    items:
                      - event: guest_arrival
                        occurred_at: "2026-09-18T10:11:00Z"
                        resident_name: null
                        room_label: null
                        guest_name: Fatima Begum
                        host_name: Aisha Khan
                        host_room_label: B-204
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/v1/gate/occupancy:
    get:
      tags: [Gate]
      operationId: gate_occupancy
      summary: Guest dining occupancy at the gate
      description: |
        Caller: gate, warden, or provost. Hall-wide guest dining counts for the
        gate home strip. `guests_in_hall_count` is every stay that has arrived
        and has not departed (includes should-have-left).
        `guests_should_have_left_count` is the subset whose hall date is after
        `guest_end_date`. This is not the full register presence board; use
        `GET /api/v1/register/summary` for resident inside/outside/late counts.
      responses:
        "200":
          description: Dining occupancy counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateOccupancy"
              example:
                guests_in_hall_count: 2
                guests_should_have_left_count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/gate/guests:
    get:
      tags: [Gate]
      operationId: gate_guests
      summary: Guests for the gate
      description: |
        Caller: gate, warden, or provost. Buckets are timing-based. `expected` is
        approved, not yet arrived, and the hall date is inside the stay.
        `in_hall` includes guests who should already have left, because departure
        is still recorded here. Optional `payment_status` is a separate axis
        (`paid` or `unpaid`); omit it to return every guest that matches the
        bucket. `limit` and `offset` page that list. The default page is 50
        guests. That number is a page size, not a cap on how many guests the
        hall can have. `q` matches the guest name, the host name, or the room
        label.
      parameters:
        - name: bucket
          in: query
          required: true
          schema:
            type: string
            enum: [expected, in_hall]
        - name: payment_status
          in: query
          required: false
          description: |
            When set, keep only guests with that payment status. Omit to include
            both paid and unpaid for the chosen bucket.
          schema:
            type: string
            enum: [paid, unpaid]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Guest cards for the gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateGuestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/gate/guests/{guest_stay_id}/arrival:
    post:
      tags: [Gate]
      operationId: record_guest_arrival
      summary: Record guest arrival
      description: |
        Caller: gate, warden, or provost. The stay must be approved, paid, not
        yet arrived, and today's hall date must fall within the stay. Guests are
        not scanned. Empty POST body; no client-supplied time.
        `arrival_time` equals `recorded_at` (same server clock tick).
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: |
            Arrival recorded.
            `arrival_time` equals `recorded_at` (same server clock tick; no client-supplied time).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestArrivalResult"
              example:
                guest_name: Zara Ahmed
                host_name: Aisha Khan
                host_room_label: B-204
                recorded_at: "2026-09-18T10:11:00Z"
                recorded_by: Fatima Khan
                arrival_time: "2026-09-18T10:11:00Z"
                message: The guest is now in the hall.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`guest_not_expected` or `payment_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/gate/guests/{guest_stay_id}/departure:
    post:
      tags: [Gate]
      operationId: record_guest_departure
      summary: Record guest departure
      description: |
        Caller: gate, warden, or provost. The guest must currently be in the hall.
        Closes the stay. Departure is still recorded when the end date has
        already passed. Empty POST body; no client-supplied time.
        `departure_time` equals `recorded_at` (same server clock tick).
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: |
            Departure recorded.
            `departure_time` equals `recorded_at` (same server clock tick; no client-supplied time).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDepartureResult"
              example:
                guest_name: Zara Ahmed
                host_name: Aisha Khan
                host_room_label: B-204
                recorded_at: "2026-09-18T10:11:00Z"
                recorded_by: Fatima Khan
                departure_time: "2026-09-18T10:11:00Z"
                message: The guest has left the hall.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest is not in the hall. Code `guest_not_in_hall`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/register/summary:
    get:
      tags: [Register]
      operationId: register_summary
      summary: Hall register counts
      description: |
        Caller: warden or provost. Counts for the whole hall, and the same counts
        for each block. A resident is counted in the block of her current room.
        A guest is counted in the host's block. The hall totals are the sum of
        the blocks.
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSummary"
              example:
                inside_count: 186
                outside_count: 22
                late_count: 3
                pending_permission_count: 4
                guests_in_hall_count: 6
                guests_should_have_left_count: 1
                pending_guest_stay_count: 2
                blocks:
                  - block_id: 00000000-0000-4000-8000-0000000000b1
                    code: B
                    name: Block-B
                    inside_count: 40
                    outside_count: 6
                    late_count: 1
                    pending_permission_count: 1
                    guests_in_hall_count: 2
                    guests_should_have_left_count: 0
                    pending_guest_stay_count: 1
                notifications_unread: true
                notifications_unread_count: 4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/register/residents:
    get:
      tags: [Register]
      operationId: list_register
      summary: Resident register
      description: |
        Caller: warden or provost. Search matches full name or room label.
        `block_id` limits the list to one block. `state=late` is outside and
        past grace; `state=out` is outside and late together. Results are
        ordered by name, or with `order=back_by` by the open outing's expected
        return, soonest first, residents inside last.
      parameters:
        - name: q
          in: query
          required: false
          description: Name or room.
          schema:
            type: string
            maxLength: 80
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [inside, outside, late, out]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [name, back_by]
            default: name
        - name: block_id
          in: query
          required: false
          description: Limit the list to residents whose current room is in this block.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Register page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/register/residents/{resident_id}:
    get:
      tags: [Register]
      operationId: register_resident
      summary: Resident record
      description: |
        Caller: warden or provost. The open outside outing when she is outside
        (status `outside`), or null when she is inside. Cancelled, returned, and
        planned outings are not returned here. The outing may be ordinary or a
        permission. Whether the guardian was told is included.
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: Resident record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/register/late:
    get:
      tags: [Register]
      operationId: late_list
      summary: Late list
      description: |
        Caller: warden or provost. Residents still outside after grace.
        Parent SMS has been sent where a number is on file.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Late page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/register/late-returns:
    get:
      tags: [Register]
      operationId: late_returns
      summary: Late returns, current and past
      description: |
        Caller: warden or provost. One row per outing that went past grace:
        still outside (`state=now`) or returned after grace (`state=past`).
        Omit `state` for both. `source` limits to ordinary, late-night, or
        home-going outings. `from` and `to` are inclusive hall dates
        (Asia/Kolkata) of the due time. Ordered by due time, newest first.
        Room and block are her current ones.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OutingSource"
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [now, past]
        - name: from
          in: query
          required: false
          description: First hall date, inclusive.
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: to
          in: query
          required: false
          description: Last hall date, inclusive. Not before `from`.
          schema:
            type: string
            format: date
            example: "2026-09-30"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Late-returns page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LateReturnPage"
              example:
                total: 1
                limit: 50
                offset: 0
                items:
                  - id: 00000000-0000-4000-8000-0000000000c1
                    resident_id: 00000000-0000-4000-8000-0000000000a1
                    resident_name: Aisha Khan
                    room_label: B-204
                    block_id: 00000000-0000-4000-8000-0000000000b1
                    block_name: Block-B
                    source: ordinary
                    due_at: "2026-09-30T12:00:00Z"
                    returned_at: null
                    minutes_late: 60
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/register/notifications:
    get:
      tags: [Register]
      operationId: list_staff_notifications
      summary: Staff inbox, newest first, one page
      description: |
        Caller: warden or provost. Hall events from the last 90 days: a
        permission requested, a guest stay requested, or an outing passing
        grace while she was out. Events are read from those records, so a
        decided request stays listed with its `outcome`, and a late entry
        shows `returned` once the gate records her return. The records are
        the permanent history; older ones are reached through the
        permission and guest-stay queues, late returns, and the register
        export. Ordered by (`occurred_at`, `id`) descending. Reading does
        not mark anything read. Gate staff get 403: the inbox is for the
        warden and the provost.

        Unread for the caller means after her mark-all instant (which starts
        at her account creation) and not marked one by one.
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            Opaque `next_cursor` from the previous page. Omit for the first
            page. A cursor that does not decode is 422 `validation_error`.
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Limit"
        - name: filter
          in: query
          required: false
          description: |
            `all` (default), `unread`, or `needs_action`. `needs_action` keeps
            a request still pending or a resident still out late.
          schema:
            type: string
            enum: [all, unread, needs_action]
            default: all
        - name: q
          in: query
          required: false
          description: Part of the resident's name or room label, any case.
          schema:
            type: string
            maxLength: 80
        - name: from
          in: query
          required: false
          description: First Asia/Kolkata date of `occurred_at`, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last Asia/Kolkata date of `occurred_at`, inclusive.
          schema:
            type: string
            format: date
        - name: block_id
          in: query
          required: false
          description: Block of the resident's current room.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffNotificationPage"
              example:
                items:
                  - id: "resident_late:00000000-0000-4000-8000-0000000000c1"
                    kind: resident_late
                    record_id: 00000000-0000-4000-8000-0000000000c1
                    resident_id: b22de000-0000-4000-8000-000000000002
                    resident_name: Aisha Khan
                    room_label: B-204
                    block_name: Block-B
                    occurred_at: "2026-09-30T12:15:00Z"
                    read_at: null
                    unread: true
                    needs_action: false
                    outcome: returned
                    decided_at: "2026-09-30T12:40:00Z"
                    decided_by_name: Fatima Khan
                next_cursor: "MjAyNi0wOS0zMFQxMjoxNTowMFp8cmVzaWRlbnRfbGF0ZTowMDAw"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/register/notifications/read:
    post:
      tags: [Register]
      operationId: mark_staff_notifications_read
      summary: Mark the caller's inbox read, up to an instant
      description: |
        Caller: warden or provost. Moves the caller's mark-all instant to
        now, or to `up_to` (a UTC instant or a `next_cursor`) when given, so
        events after the page she saw stay unread. The instant never moves
        back. Counts every event, not only the last 90 days.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsReadRequest"
            example:
              up_to: "2026-09-30T13:00:00Z"
      responses:
        "200":
          description: How many events were unread up to that instant, and what is still unread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsMarked"
              example:
                marked: 3
                unread_count: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/register/notifications/{notification_id}/read:
    post:
      tags: [Register]
      operationId: mark_staff_notification_read
      summary: Mark one event read for the caller
      description: |
        Caller: warden or provost. `notification_id` is the item `id`
        (`<kind>:<record_id>`). Idempotent. An id that names no event is 404.
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 80
          example: "permission_requested:00000000-0000-4000-8000-0000000000b1"
      responses:
        "200":
          description: The caller's unread count after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
              example:
                unread_count: 4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/push-token:
    post:
      tags: [Devices]
      operationId: register_push_token
      summary: Register this phone for push
      description: |
        Any signed-in account (resident, gate, warden, provost). Stores the
        Expo push token for the caller. Idempotent: the same token again is
        204. A token held by another account moves to the caller, because
        the phone changed hands. Push goes to residents (decisions on her
        requests, and when she is late) and to wardens and the provost (new
        permission or guest-stay requests, and a resident becoming late).
        Gate accounts may register and receive nothing today.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegister"
            example:
              token: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
              platform: android
      responses:
        "204":
          description: Stored for the caller.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Devices]
      operationId: delete_push_token
      summary: Stop push to this phone
      description: |
        Any signed-in account. Call before sign-out. Deletes the token only
        if the caller holds it. Idempotent: 204 either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenDelete"
            example:
              token: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
      responses:
        "204":
          description: The caller no longer holds that token.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/permissions:
    get:
      tags: [Permissions]
      operationId: list_permissions
      summary: Permission queue
      description: |
        Caller: warden or provost. Defaults to `pending`. Ordered by
        `created_at`, newest first (`order=newest`). Pass `order=oldest` for
        oldest first. Optional filters narrow the page: `block_id` is the block
        of the resident's current room; `permission_type` is late-night or home going;
        `created_from` and `created_to` are inclusive UTC bounds on
        `created_at`; `q` matches the resident's name or room label.
        `order=departure` sorts by departure, soonest first. Each item is a PermissionReview (includes resident
        identity). Does not expire passed permissions; call
        POST /api/v1/permissions/expire-passed first when the queue needs a
        fresh status.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to pending when omitted.
          schema:
            $ref: "#/components/schemas/PermissionStatus"
        - name: permission_type
          in: query
          required: false
          description: Limit to late-night or home-going permissions.
          schema:
            $ref: "#/components/schemas/PermissionType"
        - name: block_id
          in: query
          required: false
          description: >
            Limit to residents whose current room is in this block.
          schema:
            type: string
            format: uuid
        - name: created_from
          in: query
          required: false
          description: Inclusive lower bound on created_at (UTC instant).
          schema:
            type: string
            format: date-time
            example: "2026-09-30T00:00:00Z"
        - name: created_to
          in: query
          required: false
          description: Inclusive upper bound on created_at (UTC instant).
          schema:
            type: string
            format: date-time
            example: "2026-09-30T23:59:59Z"
        - name: q
          in: query
          required: false
          description: Resident name or room.
          schema:
            type: string
            maxLength: 80
        - name: order
          in: query
          required: false
          description: Sort by created_at (newest, oldest) or departure_at (departure). Default newest.
          schema:
            type: string
            enum: [newest, oldest, departure]
            default: newest
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Permission page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionReviewPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/permissions/expire-passed:
    post:
      tags: [Permissions]
      operationId: expire_passed_permissions
      summary: Expire passed unused permissions
      description: |
        Caller: warden or provost. Marks every unused approved permission whose
        expected return has passed as expired. GET queue and GET-by-id do not
        perform this work. Safe to call before opening the queue.
      responses:
        "200":
          description: Count of permissions updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpirePassedPermissionsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/permissions/{permission_id}:
    get:
      tags: [Permissions]
      operationId: get_permission
      summary: Permission for review
      description: |
        Caller: warden or provost. Does not expire a passed approved permission;
        call POST /api/v1/permissions/expire-passed first when review needs a
        fresh status.
      parameters:
        - $ref: "#/components/parameters/PermissionId"
      responses:
        "200":
          description: Permission, including the resident's name and room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/permissions/{permission_id}/decision:
    post:
      tags: [Permissions]
      operationId: decide_permission
      summary: Approve or reject a permission
      description: |
        Caller: provost. Only a `pending` permission can be decided. Wardens may
        list and read permissions but cannot decide them. Before deciding,
        expires this permission if it is an unused approved request whose
        expected return has already passed. Approval does not create an outing
        and does not by itself let a scan succeed before the use window.
        Rejection leaves ordinary outings available.

        Approval is refused with 409 `permission_overlap` when the resident
        already holds an approved or in-use permission whose hours overlap
        this one. A permission that starts when another ends is allowed. A
        planned ordinary outing in the same hours is not a conflict: it stays
        planned, and the permission wins at the gate and on the hall pass.
      parameters:
        - $ref: "#/components/parameters/PermissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            example:
              decision: approved
              note: ""
      responses:
        "200":
          description: Decision stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Only a pending permission can be approved or rejected. The message
            names the current status. Code `not_pending`. An approval that
            overlaps another approved or in-use permission of the same
            resident returns code `permission_overlap`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/guest-stays:
    get:
      tags: [Guest Stays]
      operationId: list_guest_stays
      summary: Guest stays
      description: |
        Caller: warden or provost. Filter by derived bucket. `in_hall` here is
        the dining set and includes guests who should have left. Use
        `should_have_left` for that subset. By default the list omits terminal
        buckets `cancelled` and `rejected` so the warden queue stays clean.
        Pass `include_terminal=true` to include those rows. An explicit
        `bucket=cancelled` or `bucket=rejected` still returns that subset
        without needing `include_terminal`. `q` matches the guest's name, the
        host's name, or the host's room label. `block_id` is the block of the
        host's current room. Each item is a GuestStaySummary card; open GET by
        id for the full GuestStay.
      parameters:
        - name: bucket
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GuestBucket"
        - name: include_terminal
          in: query
          required: false
          description: |
            When false (default), omit buckets `cancelled` and `rejected`
            unless `bucket` is set to one of those values. When true, include
            terminal rows (still subject to `bucket` when set).
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          required: false
          description: Guest name, host name, or host room.
          schema:
            type: string
            maxLength: 80
        - name: block_id
          in: query
          required: false
          description: Limit to hosts whose current room is in this block.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Guest stay page of GuestStaySummary cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStayPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/guest-stays/{guest_stay_id}:
    get:
      tags: [Guest Stays]
      operationId: get_guest_stay
      summary: Guest stay for review
      description: "Caller: warden or provost."
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Guest stay, including the host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/guest-stays/{guest_stay_id}/decision:
    post:
      tags: [Guest Stays]
      operationId: decide_guest_stay
      summary: Approve or reject a guest stay
      description: |
        Caller: provost. Only while `pending`. Wardens may list and read guest
        stays but cannot decide them. A resident cannot edit an approved stay,
        and cannot edit after arrival, so those stays are not sent back for
        another decision. When the guest has already arrived, only `approved`
        is allowed — reject is refused (the guest is in the hall). Approval does
        not mark payment and does not clear or set arrival.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not pending. Code `not_pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/guest-stays/{guest_stay_id}/payment:
    post:
      tags: [Guest Stays]
      operationId: mark_guest_payment
      summary: Mark guest payment
      description: |
        Caller: warden or provost. Records that the hall office has or has not
        taken payment outside the system. Allowed before arrival, whether the
        stay is pending or approved. The app does not collect money. When
        marking paid, `payment_note` is required (off-system proof such as a
        transaction reference, who collected cash, or a screenshot mention).
        When marking unpaid, `payment_note` is optional and any stored note is
        cleared together with the payment staff member, the payment time, and
        any optional payment evidence. A file is never required to mark paid.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
            example:
              payment_status: paid
              payment_note: "UPI ref TXN123456; collected at desk"
      responses:
        "200":
          description: Payment status stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest has already arrived or the stay is closed. Code `payment_locked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/guest-stays/{guest_stay_id}/payment/evidence:
    post:
      tags: [Guest Stays]
      operationId: upload_guest_payment_evidence
      summary: Upload guest payment evidence
      description: |
        Caller: warden or provost. Optional file proof that payment was taken
        off-system (receipt photo or PDF). Uploading is never required to mark
        a stay paid. Allowed while payment is still mutable (pending or approved,
        before arrival), whether the stay is unpaid or already paid. Replaces any
        previous evidence. Multipart field name is `evidence`. The hall reads the
        file header and ignores the client's content type. JPEG starts `FF D8 FF`,
        PNG starts `89 50 4E 47 0D 0A 1A 0A`, and PDF starts `%PDF-`. Anything
        else is 415. Maximum size is 2 MiB; a larger file is 413. An empty or
        truncated file is 422. The bytes are stored as given, in the hall
        database. The download name is `payment-evidence-<stay id>.<ext>`.
        The original filename is display only. Clients never receive a file path.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: string
                  format: binary
                  description: Receipt image (JPEG/PNG) or PDF, at most 2 MiB. The type is taken from the file header.
      responses:
        "200":
          description: Evidence stored. Full GuestStay with evidence metadata (no binary).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest has already arrived or the stay is closed. Code `payment_locked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The file is larger than 2 MiB. Code `payload_too_large`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file header is not JPEG, PNG, or PDF. Code `unsupported_media_type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The file is empty or truncated. Code `validation_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Guest Stays]
      operationId: download_guest_payment_evidence
      summary: Download guest payment evidence
      description: |
        Caller: warden or provost. Returns the stored evidence bytes when a blob
        row exists. The response type is the sniffed type. `Cache-Control` is
        `private, no-store`. The download name is `payment-evidence-<stay id>.<ext>`.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: The evidence file bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Stay not found, or no evidence on this stay. Code `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Guest Stays]
      operationId: clear_guest_payment_evidence
      summary: Clear guest payment evidence
      description: |
        Caller: warden or provost. Removes stored evidence without changing
        payment_status. Allowed while payment is still mutable. Marking unpaid
        also clears evidence.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Evidence cleared. Full GuestStay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest has already arrived or the stay is closed. Code `payment_locked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/residents:
    get:
      tags: [Hall office]
      operationId: admin_list_residents
      summary: List resident accounts
      description: "Caller: provost. Includes active and suspended residents. Does not include hall-pass tokens."
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Resident account page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentAccountPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: admin_create_resident
      summary: Create a resident
      description: |
        Caller: provost. Username is the enrolment number. Required fields include
        the resident's own phone in E.164 form, as well as the room, guardian
        details, and temporary password. The response includes the hall pass
        payload once, so the office can place it on the resident's phone. Later
        reads of the account do not return the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentCreate"
      responses:
        "201":
          description: Resident created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Enrolment number already in use. Code `duplicate_username`.
            That room is not in use. Code `room_inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/residents/{resident_id}:
    get:
      tags: [Hall office]
      operationId: admin_get_resident
      summary: Resident account
      description: "Caller: provost. No hall-pass token."
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: Resident account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Hall office]
      operationId: admin_update_resident
      summary: Update a resident
      description: |
        Caller: provost. Send only the fields that change. `course` and `phone`
        may be set to null to clear them. `guardian_name` and `guardian_phone`
        may be replaced and may not be cleared. A phone includes the country
        code. Changing `enrolment_number` changes the username. `status`
        suspends or reinstates. Suspension revokes refresh tokens.
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentUpdate"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Enrolment number already in use. Code `duplicate_username`.
            That room is not in use. Code `room_inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/residents/{resident_id}/hall-pass/reissue:
    post:
      tags: [Hall office]
      operationId: reissue_hall_pass
      summary: Reissue a hall pass
      description: |
        Caller: provost. Replaces the token immediately. The previous QR stops
        working. The new payload is returned once.
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: New hall pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallPass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/staff:
    get:
      tags: [Hall office]
      operationId: admin_list_staff
      summary: List staff accounts
      description: "Caller: provost. Gate, warden, and provost accounts."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Staff page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: admin_create_staff
      summary: Create a staff account
      description: "Caller: provost. Role is gate, warden, or provost. The sample body leaves the temporary password out of this repository. The field is required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreate"
            example:
              full_name: Imran Qureshi
              username: imran.qureshi
              role: gate
              job_title: Gatekeeper
      responses:
        "201":
          description: Staff account created. The password is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already in use. Code `duplicate_username`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/staff/{user_id}:
    patch:
      tags: [Hall office]
      operationId: admin_update_staff
      summary: Update a staff account
      description: |
        Caller: provost. Role cannot be changed on this route, and a staff
        account cannot become a resident. Suspension revokes refresh tokens.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{user_id}/password:
    post:
      tags: [Hall office]
      operationId: reset_password
      summary: Reset a password
      description: |
        Caller: provost. Sets a temporary password and revokes that user's
        refresh tokens. Works for residents and staff. The temporary password
        is at least 10 characters and includes an uppercase letter, a lowercase
        letter, a number, and a symbol.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password reset.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/blocks:
    get:
      tags: [Hall office]
      operationId: list_blocks
      summary: List blocks
      description: "Caller: provost. Includes inactive blocks."
      responses:
        "200":
          description: Blocks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: create_block
      summary: Create a block
      description: "Caller: provost. `code` is the short label used in room names, such as B."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: Block created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Code already in use. Code `duplicate_block`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/blocks/{block_id}:
    patch:
      tags: [Hall office]
      operationId: update_block
      summary: Update a block
      description: "Caller: provost. Deactivate with `status` `inactive`. Rooms in the block remain."
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdate"
      responses:
        "200":
          description: Block updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/rooms:
    get:
      tags: [Hall office]
      operationId: list_rooms
      summary: List rooms
      description: |
        Caller: provost. The response is the room array itself. There is no
        paging, because the phone picker reads the whole list.
      parameters:
        - name: block_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: create_room
      summary: Create a room
      description: |
        Caller: provost. `label` is stored as `{block code}-{number}`. The number
        is text, so `087` stays `087`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreate"
            example:
              block_id: 00000000-0000-4000-8000-0000000000b1
              number: "204"
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That number is already used in the block. Code `duplicate_room`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/rooms/{room_id}:
    patch:
      tags: [Hall office]
      operationId: update_room
      summary: Update a room
      description: "Caller: provost. A room with residents assigned to it can be deactivated only after they are moved."
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Room updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Residents are still assigned. Code `room_in_use`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/destinations:
    get:
      tags: [Hall office]
      operationId: admin_list_destinations
      summary: List destinations
      description: "Caller: provost. Includes inactive rows. Named places are alphabetical, ignoring capitals. The free-text choice is last. The resident catalog route returns active rows only."
      responses:
        "200":
          description: Destinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: create_destination
      summary: Create a destination
      description: |
        Caller: provost. Only one active destination may have `source` `custom`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationCreate"
      responses:
        "201":
          description: Destination created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`duplicate_destination` or `other_exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/destinations/{destination_id}:
    patch:
      tags: [Hall office]
      operationId: update_destination
      summary: Update a destination
      description: "Caller: provost. Deactivating a destination does not change the place already stored on an outing."
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Destination updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another active Other row exists. Code `other_exists`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/settings:
    get:
      tags: [Hall office]
      operationId: get_settings
      summary: Hall settings
      description: "Caller: provost. Ordinary outing windows are hall-local HH:MM. Season starts are MM-DD. Clients show both on a 12-hour clock and as a day and month. SMS templates are under /api/v1/admin/notifications."
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Hall office]
      operationId: update_settings
      summary: Update hall settings
      description: |
        Caller: provost. Send only the fields that change. Summer and winter
        ordinary outing windows, and the two season start dates, are always set.
        Changing grace does not rewrite outings that already have a
        `grace_ends_at`. SMS templates live under `/api/v1/admin/notifications`.
        A time of day is sent as HH:MM. A season start is sent as MM-DD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HallSettingsUpdate"
      responses:
        "200":
          description: Settings saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/notifications:
    get:
      tags: [Hall office]
      operationId: get_notifications
      summary: Hall notification settings
      description: |
        Caller: provost only (same gate as hall settings). Returns the late and
        return SMS templates used for guardian notices. Placeholders are listed
        on `HallNotifications`.
      responses:
        "200":
          description: Notification settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallNotifications"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Hall office]
      operationId: update_notifications
      summary: Update hall notification settings
      description: |
        Caller: provost only (same gate as hall settings). Send only the fields
        that change. Each template must keep the placeholders listed on
        `HallNotifications`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HallNotificationsUpdate"
      responses:
        "200":
          description: Notification settings saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallNotifications"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/register/export:
    get:
      tags: [Hall office]
      operationId: export_register
      summary: Export the register
      description: |
        Caller: provost. One CSV file. UTF-8, comma separated, header row required.
        Resident rows and guest rows share one header. Cells that do not apply
        to the row are empty.

        Header, in this order:

        `record_type,full_name,enrolment_number,room_label,block_code,course,presence,state,place,exited_at,expected_return_at,grace_ends_at,returned_at,outing_type,guardian_name,guardian_phone,guest_name,relation,host_name,host_room_label,guest_start_date,guest_end_date,payment_status,guest_bucket,arrived_at,departed_at`

        `record_type` is `resident` or `guest`. Instants are UTC. Dates are
        YYYY-MM-DD. This export contains guardian phone numbers and is not a
        warden route. `block_code` is the resident's block, or the host's block
        on a guest row. A data cell whose text starts with `=`, `+`, `-`, `@`,
        a tab, or a carriage return is prefixed with one single quote so a
        spreadsheet keeps the text. The header row is not prefixed. Other text
        is unchanged.
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/sms:
    get:
      tags: [Hall office]
      operationId: list_sms
      summary: SMS log
      description: "Caller: provost. Newest first. Each row is a late notice or a return notice sent to the guardian phone."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: SMS page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/audit:
    get:
      tags: [Hall office]
      operationId: list_audit
      summary: Audit log
      description: "Caller: provost. Newest first. Detail never contains a password, a refresh token, or a hall-pass token."
      parameters:
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ResidentId:
      name: resident_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutingId:
      name: outing_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuestStayId:
      name: guest_stay_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DestinationId:
      name: destination_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: The access token is missing or expired, or the username and password were refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Sign in again.
    Forbidden:
      description: The signed-in role cannot call this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: This account cannot do that.
    NotFound:
      description: No record with that id is visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: That record was not found.
    Unprocessable:
      description: The JSON is the wrong shape, or a field fails a constraint that does not depend on existing rows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_error
              message: Expected return must be after departure.
              details:
                field: expected_return_at

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        e2e_scratch:
          type: boolean
          enum: [true]
          description: |
            Present only on the throwaway end-to-end server (`E2E_SCRATCH=1`).
            Production refuses to start with that variable set.
    Ready:
      type: object
      additionalProperties: false
      required: [status, user_version]
      properties:
        status:
          type: string
          enum: [ready]
        user_version:
          type: integer
          minimum: 0
          description: Schema version after migrations.


    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail, error]
      properties:
        detail:
          type: string
          description: |
            The same sentence as `error.message`. Kept so a client that still
            reads `detail` does not break.
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine code. Known codes: `unauthenticated`, `rate_limited`, `not_ready`, `forbidden`,
            `not_found`, `validation_error`, `duplicate_username`,
            `duplicate_block`, `duplicate_room`, `duplicate_destination`,
            `room_in_use`, `room_inactive`, `other_exists`, `already_outside`, `return_already_planned`,
            `open_outing_exists`,
            `outside_ordinary_hours`, `permission_required`, `no_outing_planned`,
            `permission_not_yet_valid`, `outing_not_yet_open`, `permission_overlap`,
            `duplicate_scan`, `resident_suspended`, `unknown_hall_pass`,
            `not_pending`, `permission_in_use`, `not_cancellable`, `not_editable`, `guest_not_expected`, `guest_not_in_hall`,
            `payment_required`, `payment_locked`, `account_in_use`.
        message:
          type: string
          description: Sentence the phone can show. Not a stack trace.
        request_id:
          type: string
          description: |
            The X-Request-ID echoed on this response. Always present. The same
            value is on the response header.
        details:
          type: object
          additionalProperties: true

    ListMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 200

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
          description: Her current password, sent once to confirm the deletion.

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 200
        new_password:
          type: string
          minLength: 10
          maxLength: 200
          description: >
            At least 10 characters, with one uppercase letter, one lowercase
            letter, one number, and one symbol (a character that is not a letter
            or number). Shorter than 10 says "Use at least 10 characters."
            Missing a class says "Include an uppercase letter, a lowercase
            letter, a number, and a symbol."
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$"

    ResidentOnboardRequest:
      type: object
      additionalProperties: false
      required:
        - full_name
        - enrolment_number
        - password
        - phone
        - block_id
        - room_id
        - guardian_name
        - guardian_phone
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        enrolment_number:
          type: string
          minLength: 1
          maxLength: 40
          description: >
            Roll / enrolment number. Becomes the username. Unique hall-wide,
            ignoring capitals.
        password:
          type: string
          minLength: 10
          maxLength: 200
          description: >
            First password she chooses. Stored as Argon2id. Not returned. Sample
            bodies in this repository omit the value; the field is required.
            At least 10 characters, with one uppercase letter, one lowercase
            letter, one number, and one symbol (a character that is not a letter
            or number). Shorter than 10 says "Use at least 10 characters."
            Missing a class says "Include an uppercase letter, a lowercase
            letter, a number, and a symbol."
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$"
        course:
          type: string
          maxLength: 120
          description: Optional. For example B.A. LL.B. (Hons.).
        phone:
          type: string
          description: >
            The resident's own Indian mobile. +91 followed by exactly 10 digits.
            Required on self-onboard. Not the guardian phone. Another country
            or another length says "Use an Indian mobile: +91 and exactly 10 digits."
          pattern: "^\\+91[0-9]{10}$"
          example: "+919811112222"
        block_id:
          type: string
          format: uuid
          description: The block selected for self-onboard. The room must belong to it.
        room_id:
          type: string
          format: uuid
          description: The active room selected for self-onboard.
        guardian_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Parent or guardian the hall contacts.
        guardian_phone:
          type: string
          description: >
            Guardian Indian mobile. +91 followed by exactly 10 digits. Late and
            return SMS go here. Another country or another length says
            "Use an Indian mobile: +91 and exactly 10 digits."
          pattern: "^\\+91[0-9]{10}$"
          example: "+919876543210"

    ResidentOnboardResponse:
      type: object
      additionalProperties: false
      required: [enrolment_number, status, message]
      properties:
        enrolment_number:
          type: string
          description: Stored spelling of the enrolment number.
        status:
          type: string
          enum: [active]
        message:
          type: string
          description: Ready copy for the phone. Exact sentence for clients.

    OnboardBlockOption:
      type: object
      additionalProperties: false
      required: [id, name, rooms]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rooms:
          type: array
          description: >
            Active rooms in this block that still have a free bed. May be empty
            when every room is full or inactive.
          items:
            $ref: "#/components/schemas/OnboardRoomOption"
    OnboardRoomOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          minLength: 10
          maxLength: 200
          description: >
            At least 10 characters, with one uppercase letter, one lowercase
            letter, one number, and one symbol (a character that is not a letter
            or number). Shorter than 10 says "Use at least 10 characters."
            Missing a class says "Include an uppercase letter, a lowercase
            letter, a number, and a symbol."
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$"

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      additionalProperties: false
      required: [id, role, full_name, username, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        full_name:
          type: string
        username:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"

    Role:
      type: string
      enum: [resident, gate, warden, provost]

    StaffRole:
      type: string
      enum: [gate, warden, provost]

    AccountStatus:
      type: string
      enum: [active, suspended]
      description: >
        `active` may sign in. `suspended` may not.

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, role, full_name, username, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        full_name:
          type: string
        username:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        resident:
          oneOf:
            - $ref: "#/components/schemas/ResidentSummary"
            - type: "null"
        staff:
          oneOf:
            - $ref: "#/components/schemas/StaffSummary"
            - type: "null"

    ResidentSummary:
      type: object
      additionalProperties: false
      required: [enrolment_number, room_label, presence]
      properties:
        enrolment_number:
          type: string
        course:
          oneOf:
            - type: string
            - type: "null"
        room_label:
          type: string
          example: B-204
        block_name:
          type: string
          example: Block B
        presence:
          $ref: "#/components/schemas/Presence"

    StaffSummary:
      type: object
      additionalProperties: false
      required: [job_title]
      properties:
        job_title:
          type: string
          description: Name of the post, such as Gatekeeper or Resident warden. The role decides what the account may do.

    Presence:
      type: string
      enum: [inside, outside]

    RegisterState:
      type: string
      enum: [inside, outside, late]

    OutingSource:
      type: string
      enum: [ordinary, late_night, home_going]
      description: An ordinary outing, or one made under a late-night or home-going permission.

    LateReturn:
      type: object
      additionalProperties: false
      required:
        - id
        - resident_id
        - resident_name
        - room_label
        - block_id
        - block_name
        - source
        - due_at
        - returned_at
        - minutes_late
      properties:
        id:
          type: string
          format: uuid
          description: The outing.
        resident_id:
          type: string
          format: uuid
        resident_name:
          type: string
        room_label:
          type: string
          description: Her current room.
        block_id:
          type: string
          format: uuid
        block_name:
          type: string
        source:
          $ref: "#/components/schemas/OutingSource"
        due_at:
          type: string
          format: date-time
          description: The outing's expected return.
        returned_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Gate return. Null while she is still out.
        minutes_late:
          type: integer
          minimum: 0
          description: Whole minutes from due_at to returned_at, or to now while she is still out.

    LateReturnPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LateReturn"

    StaffNotification:
      type: object
      additionalProperties: false
      required: [id, kind, record_id, resident_id, resident_name, room_label, block_name, occurred_at, read_at, unread, needs_action, outcome, decided_at, decided_by_name]
      properties:
        id:
          type: string
          description: Stable `<kind>:<record_id>`. Use it to mark one event read.
        kind:
          type: string
          enum: [permission_requested, guest_stay_requested, resident_late]
        record_id:
          type: string
          format: uuid
          description: |
            The permission, the guest stay, or the outing. Open it with
            GET /api/v1/permissions/{id}, GET /api/v1/guest-stays/{id}, or
            GET /api/v1/register/residents/{resident_id}.
        resident_id:
          type: string
          format: uuid
        resident_name:
          type: string
          description: The resident who asked, hosts the guest, or is late.
        room_label:
          type: string
        block_name:
          type: string
        occurred_at:
          type: string
          format: date-time
          description: When the request was made, or when grace ended on the outing.
        read_at:
          type: [string, "null"]
          description: When the caller read it, one by one or by mark-all. Null while unread.
        unread:
          type: boolean
          description: Same as `read_at` being null. Kept for older clients.
        needs_action:
          type: boolean
          description: A request still pending, or a resident still out late.
        outcome:
          type: [string, "null"]
          enum: [approved, declined, cancelled, returned, null]
          description: |
            Null while pending or while she is still out. `approved` covers a
            permission later used or expired and a guest stay that departed.
            `returned` is for `resident_late` once the gate recorded her return.
        decided_at:
          type: [string, "null"]
          description: When it was approved, declined, or cancelled, or when she returned.
        decided_by_name:
          type: [string, "null"]
          description: The provost who decided, the resident who cancelled, or the gate staff who recorded her return.

    StaffNotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffNotification"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page. Null on the last page.

    NotificationsReadRequest:
      type: object
      additionalProperties: false
      properties:
        up_to:
          type: [string, "null"]
          maxLength: 200
          description: A UTC instant (`YYYY-MM-DDTHH:MM:SSZ`) or a `next_cursor`. Omit for now.

    NotificationsMarked:
      type: object
      additionalProperties: false
      required: [marked, unread_count]
      properties:
        marked:
          type: integer
          minimum: 0
        unread_count:
          type: integer
          minimum: 0

    UnreadCount:
      type: object
      additionalProperties: false
      required: [unread_count]
      properties:
        unread_count:
          type: integer
          minimum: 0

    PushTokenRegister:
      type: object
      additionalProperties: false
      required: [token, platform]
      properties:
        token:
          type: string
          maxLength: 200
          pattern: '^Expo(nent)?PushToken\[[A-Za-z0-9_-]+\]$'
          description: From expo-notifications getExpoPushTokenAsync({ projectId }).
        platform:
          type: string
          enum: [ios, android]

    PushTokenDelete:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200

          description: How many events were unread for her before this call.

    HomeResident:
      type: object
      additionalProperties: false
      required: [full_name, enrolment_number, room_label, block_name, presence, hall_name, permissions_requested, permissions_rejected, ordinary_returns, late_night_returns, home_going_returns, guest_stays]
      properties:
        full_name:
          type: string
        enrolment_number:
          type: string
        course:
          oneOf:
            - type: string
            - type: "null"
        room_label:
          type: string
          example: B-204
        block_name:
          type: string
          example: Block-B
        presence:
          $ref: "#/components/schemas/Presence"
        hall_name:
          type: string
          description: The hall's name, from hall settings.
          example: Begum Sultan Jahan Hall
        permissions_requested:
          type: integer
          minimum: 0
          description: Late-night and home-going permissions she has sent.
        permissions_rejected:
          type: integer
          minimum: 0
          description: Permissions the provost rejected.
        ordinary_returns:
          type: integer
          minimum: 0
          description: Ordinary outings she has returned from.
        late_night_returns:
          type: integer
          minimum: 0
          description: Late-night outings she has returned from.
        home_going_returns:
          type: integer
          minimum: 0
          description: Home-going outings she has returned from.
        guest_stays:
          type: integer
          minimum: 0
          description: Guest stays she has requested.

    ResidentHome:
      type: object
      additionalProperties: false
      required: [resident, ordinary_outing_active, hall_pass_outing_type, current_outing, upcoming_outings, active_permission, recent_history, notifications_unread, notifications_unread_count]
      properties:
        resident:
          $ref: "#/components/schemas/HomeResident"
        ordinary_outing_active:
          type: boolean
          description: |
            True when one of her ordinary outings is inside its show window
            now. That window opens 30 minutes before `starts_at` (a plan made
            inside that lead is open as soon as it exists) and lasts until the
            outing ends. Planning another is refused while this is true. It is
            about ordinary outings only; `hall_pass_outing_type` covers all types.
        hall_pass_outing_type:
          oneOf:
            - $ref: "#/components/schemas/OutingType"
            - type: "null"
          description: |
            The type of outing whose hall-pass QR is showing now, by the same
            rule as `GET /api/v1/me/hall-pass`. Null when the QR is hidden.
        current_outing:
          oneOf:
            - $ref: "#/components/schemas/Outing"
            - type: "null"
        upcoming_outings:
          type: array
          description: |
            Planned ordinary outings whose expected return is still in the
            future. Soonest start first. Not returned, cancelled, outside, or
            already past.
          items:
            $ref: "#/components/schemas/UpcomingOuting"
        active_permission:
          oneOf:
            - $ref: "#/components/schemas/Permission"
            - type: "null"
          description: The newest permission in `pending`, `approved`, or `in_use`, if any.
        recent_history:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/HistoryEvent"
        notifications_unread:
          type: boolean
          description: True when `notifications_unread_count` is above zero.
        notifications_unread_count:
          type: integer
          minimum: 0
          description: Unread rows in her inbox, any age. Use it for the bell and the app badge.

    ResidentNotification:
      type: object
      additionalProperties: false
      required: [id, kind, record_id, occurred_at, read_at, unread, needs_action, outcome, decided_at, decided_by_name, place, guest_name, permission_id, permission_type, decision, departure_at, expected_return_at, decided_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [permission_decided, guest_stay_decided, resident_late]
        record_id:
          type: string
          format: uuid
          description: The permission, guest stay, or outing.
        occurred_at:
          type: string
          description: When the row was written.
        read_at:
          type: [string, "null"]
        unread:
          type: boolean
          description: Same as `read_at` being null. Kept for older clients.
        needs_action:
          type: boolean
          description: True for `resident_late` while she is still out.
        outcome:
          type: [string, "null"]
          enum: [approved, declined, returned, null]
          description: The decision, or `returned` on a late row once she is back. Null while she is still out.
        decided_at:
          type: [string, "null"]
        decided_by_name:
          type: [string, "null"]
          description: The provost who decided, or the gate staff who recorded her return.
        place:
          type: [string, "null"]
          description: Permission short place or outing place. Null for a guest stay.
        guest_name:
          type: [string, "null"]
          description: Set only for `guest_stay_decided`.
        permission_id:
          type: [string, "null"]
          description: Set only for `permission_decided`. Kept for older clients.
        permission_type:
          type: [string, "null"]
          enum: [late_night, home_going, null]
        decision:
          type: [string, "null"]
          enum: [approved, rejected, null]
          description: Stored decision word. Kept for older clients; prefer `outcome`.
        departure_at:
          type: [string, "null"]
        expected_return_at:
          type: [string, "null"]
          description: Permission or outing expected return.
        decided_by:
          type: [string, "null"]
          description: Same as `decided_by_name`. Kept for older clients.
        created_at:
          type: string
          description: Same as `occurred_at`. Kept for older clients.

    ResidentNotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ResidentNotification"
        next_cursor:
          type: [string, "null"]

    HallPass:
      type: object
      additionalProperties: false
      required: [qr_payload, full_name, room_label]
      properties:
        qr_payload:
          type: string
          description: Text encoded in the QR image. Prefix `bsj:v1:`.
          example: bsj:v1:example-token
        full_name:
          type: string
        room_label:
          type: string

    ResidentHallPass:
      type: object
      additionalProperties: false
      required: [qr_payload, full_name, room_label, outing_id, permission_id, outing_type, place, starts_at, expected_return_at, qr_visible, qr_visible_from, qr_visible_until]
      properties:
        qr_payload:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Permanent hall-pass text (`bsj:v1:` plus the token) when `qr_visible`
            is true. Null when the phone must not show a QR yet. The gate still
            scans this same text.
        full_name:
          type: string
        room_label:
          type: string
        outing_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: |
            The outing row this pass is for: a planned ordinary outing, or any
            outing she is outside on. Null for an approved permission she has
            not used yet, and when she has nothing coming.
        permission_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: The permission this pass is for. Null for an ordinary outing.
        outing_type:
          oneOf:
            - $ref: "#/components/schemas/OutingType"
            - type: "null"
          description: Which kind of outing the pass is for. Null when she has nothing coming.
        place:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Stored place on that outing: the list name, the words typed for
            Other, or the permission's short place. Same meaning as `place`
            on an outing. Null when `outing_id` is null.
        starts_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            When she leaves. Null when `outing_id` is null, on a permission
            outing, and on an ordinary plan saved before this field existed.
        expected_return_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: When she comes back. Null when `outing_id` is null.
        qr_visible:
          type: boolean
        qr_visible_from:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the QR may be shown. Null when she has nothing coming, and on a plan saved before `starts_at` existed.
        qr_visible_until:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            Planned outings and permissions close at `expected_return_at`. Null
            while she is outside, because the outing ends at the return scan.

    HistoryEvent:
      type: object
      additionalProperties: false
      required: [event, place, outing_id, exited_at, returned_at, recorded_by]
      properties:
        event:
          type: string
          enum: [exited, returned]
        place:
          type: string
          description: Place remembered on the outing.
        outing_id:
          type: string
          format: uuid
        exited_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Set when event is exited; null when event is returned.
        returned_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Set when event is returned; null when event is exited.
        recorded_by:
          type: string
          description: >
            Display name of the staff member who recorded that exit or return
            (from outings.exit_recorded_by or outings.return_recorded_by).

    HistoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - place
        - who
        - started_at
        - ended_at
        - exit_recorded_by
        - return_recorded_by
        - unused
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [late_night, home_going, guest_stay, outing]
        place:
          oneOf:
            - type: string
            - type: "null"
          description: Null when the record has nowhere, such as a guest stay.
        who:
          oneOf:
            - type: string
            - type: "null"
          description: Guest name for a guest stay. Null for every other kind.
        started_at:
          type: string
          format: date-time
          description: |
            Outing: planned leave when unused, gate exit when finished.
            Permission: departure_at. Guest stay: start of guest_start_date
            in Asia/Kolkata.
        ended_at:
          type: string
          format: date-time
          description: |
            Outing: planned return when unused, gate return when finished.
            Permission: expected_return_at. Guest stay: end of guest_end_date
            in Asia/Kolkata (23:59:59).
        exit_recorded_by:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Display name of the staff member who recorded the gate exit.
            Null when there was no gate exit, including every unused row and
            every guest stay.
        return_recorded_by:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Display name of the staff member who recorded the gate return.
            Null when there was no gate return, including every unused row and
            every guest stay.
        unused:
          type: boolean
          description: |
            True when an approved window or planned outing ended without use.
            False when the outing has both a gate exit and a gate return, the
            permission status is completed, or the guest stay status is departed.

    HistoryList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/HistoryItem"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page. Null on the last page.

    Destination:
      type: object
      additionalProperties: false
      required: [id, name, source, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Named places are shown alphabetical by this name, ignoring capitals. The free-text choice is last.
        source:
          type: string
          enum: [preset, custom]
          description: >
            Where the place comes from. `preset` is a fixed named place on the
            list. `custom` is the single free-text (Other) choice.
        status:
          type: string
          enum: [active, inactive]
          description: "`active` while it can be chosen. `inactive` when retired."

    DestinationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Destination"

    DestinationCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        source:
          type: string
          enum: [preset, custom]
          default: preset
          description: >
            `preset` for a fixed named place. `custom` for the free-text Other
            choice.

    DestinationUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        source:
          type: string
          enum: [preset, custom]
          description: >
            `preset` for a fixed named place. `custom` for the free-text Other
            choice.
        status:
          type: string
          enum: [active, inactive]

    PlanOutingRequest:
      type: object
      additionalProperties: false
      required: [destination_id, starts_at, expected_return_at]
      properties:
        destination_id:
          type: string
          format: uuid
        destination_text:
          type: string
          minLength: 1
          maxLength: 120
          description: Required when the destination is the Other row. Ignored otherwise.
        starts_at:
          type: string
          format: date-time
          description: When she plans to leave. UTC instant. Same hall day as the expected return, inside ordinary hours.
        expected_return_at:
          type: string
          format: date-time


    UpcomingOuting:
      type: object
      additionalProperties: false
      required: [id, place, starts_at, expected_return_at, can_modify]
      properties:
        id:
          type: string
          format: uuid
        place:
          type: string
          description: List name, or the words typed for Other.
        starts_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: When she plans to leave. Empty only on an ordinary plan saved before this field existed.
        expected_return_at:
          type: string
          format: date-time
          description: When she plans to be back.
        can_modify:
          type: boolean
          description: |
            True only while she may still change or cancel this outing.
            False once its hall-pass window is open, and false while she is
            outside on it. The phone does not decide this from the clock.

    OutingType:
      type: string
      enum: [ordinary, late_night, home_going]
      description: Ordinary, late-night, and home going are one outing record. This says which.

    OutingStatus:
      type: string
      enum: [planned, outside, returned, cancelled]

    Outing:
      type: object
      additionalProperties: false
      required:
        - id
        - outing_type
        - status
        - place
        - starts_at
        - qr_visible
        - qr_visible_from
        - qr_visible_until
        - expected_return_at
        - grace_ends_at
        - lateness
        - created_at
      properties:
        id:
          type: string
          format: uuid
        permission_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Empty for an ordinary outing. Set when the exit used a permission.
        outing_type:
          $ref: "#/components/schemas/OutingType"
        status:
          $ref: "#/components/schemas/OutingStatus"
        place:
          type: string
          description: List name, the words typed for Other, or the permission's short place.
        starts_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: When she planned to leave. Empty on a permission outing and on an ordinary outing saved before this field existed.
        qr_visible:
          type: boolean
          description: |
            True when the phone may show this outing's hall-pass QR now. A
            planned ordinary outing opens 30 minutes before `starts_at` (a plan
            made inside that lead is open as soon as it exists) and closes at
            `expected_return_at`. An outing she is outside on, of any type,
            stays true until the return scan.
        qr_visible_from:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        qr_visible_until:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            `expected_return_at` while the ordinary outing is still planned.
            Null while she is outside, until the return scan.
        expected_return_at:
          type: string
          format: date-time
          description: UTC instant. Clients show India time on a 12-hour clock.
        grace_ends_at:
          type: string
          format: date-time
        exited_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Empty only while an ordinary outing is still planned. Required once the resident has left.
        exit_recorded_by_name:
          oneOf:
            - type: string
            - type: "null"
          description: Staff member who scanned the exit. Empty only while exited_at is empty.
        returned_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Empty until the return scan. Required once the resident has returned.
        return_recorded_by_name:
          oneOf:
            - type: string
            - type: "null"
          description: Staff member who scanned the return. Empty only while returned_at is empty.
        lateness:
          type: string
          enum: [on_time, late]
          description: |
            For a planned or outside outing, `late` when now is after `grace_ends_at`;
            otherwise `on_time`. Returned and cancelled outings keep the value at read time.
        created_at:
          type: string
          format: date-time

    OutingList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
