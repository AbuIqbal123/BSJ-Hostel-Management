          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    GuestStayUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Editable fields for PATCH own guest stay. Before arrival, send all five
        fields (full replace of name, relation, dates, and reason). After arrival
        and before departure, only `guest_start_date` and/or `guest_end_date` may be present —
        name, relation, and reason are locked. Every successful edit returns
        status to pending and clears the decision so a warden or the provost must
        approve again; payment_status is left unchanged.
      properties:
        guest_name:
          type: string
          minLength: 1
          maxLength: 120
        relation:
          type: string
          minLength: 1
          maxLength: 80
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    GuestStay:
      type: object
      additionalProperties: false
      required:
        - id
        - host_resident_id
        - host_name
        - host_room_label
        - guest_name
        - relation
        - guest_start_date
        - guest_end_date
        - inclusive_days
        - reason
        - status
        - payment_status
        - bucket
        - created_at
      properties:
        id:
          type: string
          format: uuid
        host_resident_id:
          type: string
          format: uuid
        host_name:
          type: string
        host_room_label:
          type: string
        guest_name:
          type: string
        relation:
          type: string
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        inclusive_days:
          type: integer
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, cancelled, departed]
        payment_status:
          type: string
          enum: [unpaid, paid]
        payment_note:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Off-system payment proof (transaction reference, who collected cash,
            screenshot mention, and similar). Set when payment is marked paid;
            null when unpaid.
        bucket:
          $ref: "#/components/schemas/GuestBucket"
        decision_note:
          oneOf:
            - type: string
            - type: "null"
        decided_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: UUID of the warden or provost who decided. Empty while waiting, and empty if the resident cancels before a decision. Set once a warden or the provost approves or rejects.
        arrived_recorded_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: UUID of the staff member who recorded arrival. Empty until arrival is recorded.
        departed_recorded_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: UUID of the staff member who recorded departure. Empty until departure is recorded.
        arrived_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        departed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          type: string
          format: date-time

