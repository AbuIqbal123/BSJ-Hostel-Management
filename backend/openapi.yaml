    HallSettings:
      type: object
      additionalProperties: false
      required:
        - hall_name
        - university_name
        - timezone
        - grace_minutes
        - ordinary_outing_max_hours
        - permission_early_minutes
        - guest_max_inclusive_days
        - guest_min_lead_days
        - scan_duplicate_window_seconds
        - late_sms_template
        - return_sms_template
      properties:
        hall_name:
          type: string
        university_name:
          type: string
        timezone:
          type: string
          example: Asia/Kolkata
        grace_minutes:
          type: integer
        ordinary_hours_end:
          oneOf:
            - type: string
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
          description: Hall-local HH:MM. Null until the hall sets ordinary closing time.
        ordinary_outing_max_hours:
          type: integer
        permission_early_minutes:
          type: integer
        guest_max_inclusive_days:
          type: integer
        guest_min_lead_days:
          type: integer
        scan_duplicate_window_seconds:
          type: integer
        late_sms_template:
          type: string
          description: "Placeholders: {resident_name}, {room}, {expected_return_local}, {hall_name}."
        return_sms_template:
          type: string
          description: "Placeholders: {resident_name}, {room}, {returned_at_local}, {hall_name}."

    HallSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        hall_name:
          type: string
          minLength: 1
          maxLength: 160
        university_name:
          type: string
          minLength: 1
          maxLength: 160
        grace_minutes:
          type: integer
          minimum: 0
          maximum: 180
        ordinary_hours_end:
          oneOf:
            - type: string
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
        ordinary_outing_max_hours:
          type: integer
          minimum: 1
          maximum: 72
        permission_early_minutes:
          type: integer
          minimum: 0
          maximum: 180
        guest_max_inclusive_days:
          type: integer
          minimum: 1
          maximum: 30
        guest_min_lead_days:
          type: integer
          minimum: 0
          maximum: 14
        scan_duplicate_window_seconds:
          type: integer
          minimum: 0
          maximum: 600
        late_sms_template:
          type: string
          minLength: 1
        return_sms_template:
          type: string
          minLength: 1

