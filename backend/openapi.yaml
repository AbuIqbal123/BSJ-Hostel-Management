openapi: 3.1.0
info:
  title: Begum Sultan Jahan Hall API
  version: 0.2.12
  description: |
    HTTP contract for the hostel movement system. Schema version of the database
    is tracked separately in `docs/database/database.md` (0.3.4).

    This version is the contract. Auth, resident phone (home, history, hall pass,
    destinations, ordinary outings, permissions, guest stays), register, staff
    permission queue, staff guest stays, gate scans, guests, and occupancy, and hall office
    (settings, blocks, rooms, destinations, residents, staff, password reset,
    audit, SMS log, register export) respond. Swagger on this server is the
    review surface for purpose, payload, and response.

    JSON names are snake_case. Instants are UTC `YYYY-MM-DDTHH:MM:SSZ`. Calendar
    dates are hall-local `YYYY-MM-DD` in Asia/Kolkata. A time of day is `HH:MM`.
    A season start is `MM-DD`. A phone number includes the country code, `+`
    then digits. Clients show India time on a 12-hour clock and a date as the
    day, the month name, and the year. `2026-09-18T13:30:00Z` is shown as
    18 September 2026, 7:00 PM. This API returns the stored form.

    The caller sends an access token as `Authorization: Bearer`, except on
    `GET /health`, `POST /api/v1/auth/login`, and `POST /api/v1/auth/refresh`.

    Access tokens last 15 minutes. Refresh tokens last 30 days. Passwords are
    at least 10 characters and are stored as Argon2id. Accounts are issued by
    the hall office. A resident username is the enrolment number.

    Stored state and lifecycles live in `docs/database/database.md`. This file does not
    repeat the column list. The reading copy of this contract is `docs/api/api.md`.
  license:
    name: Proprietary
    identifier: LicenseRef-proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api-dev.domain.com
    description: Development environment, mock SMS only
  - url: https://api.domain.com
    description: Production

tags:
  - name: Operations
    description: Process health. No hall data.
  - name: Auth
    description: Hall-issued accounts. No public registration and no guardian login.
  - name: Resident
    description: The resident phone. Ordinary outings, home, destinations, and the hall pass.
  - name: Permissions
    description: >
      Late-night and home-going permissions. Resident requests under /api/v1/me/permissions;
      warden or provost queue and decisions under /api/v1/permissions.
  - name: Guest Stays
    description: >
      Guest applications. Resident applies and edits under /api/v1/me/guest-stays;
      warden or provost review under /api/v1/guest-stays. A resident edit returns the
      stay to pending so staff must approve again. Gate arrival and departure stay under Gate.
  - name: Gate
    description: Scan the permanent hall pass, and record guest arrival and departure. Guests have no hall pass.
  - name: Register
    description: >
      Warden and provost presence board under /api/v1/register. Inside, outside, and late
      for the hall and each block.
  - name: Hall office
    description: Provost only. Residents, staff, rooms, destinations, settings, export, SMS log, and audit.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Operations]
      operationId: health
      summary: Process health
      description: Reports that the API process is up. It does not check the database.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /ready:
    get:
      tags: [Operations]
      operationId: ready
      summary: Process readiness
      description: |
        Opens the hall database and reports `PRAGMA user_version`. Use this to
        confirm the process can read the hall file. `GET /health` stays shallow.
      security: []
      responses:
        "200":
          description: The database opened and the schema version was read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: ready
                user_version: 8
        "503":
          description: The database could not be opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: not_ready
                  message: The hall database could not be opened.

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Caller: anyone with a hall-issued account. A resident uses the enrolment
        number as the username. The sample body leaves the password field out of
        this repository. The field is required.

        An unknown username and a known username with the wrong password both
        return the same message, so a caller cannot tell whether the username
        exists. A correct password on a suspended account says the account is
        suspended and asks the caller to contact the Hall Office. Repeated
        attempts from the same client are limited; further attempts return 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: 24-GLLB-118
      responses:
        "200":
          description: New access token and refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: |
            Sign-in was refused. Unknown username and wrong password share one
            message. A suspended account asks the caller to contact the Hall Office.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_credentials:
                  summary: Username or password is wrong
                  value:
                    error:
                      code: unauthenticated
                      message: Username or password is wrong.
                suspended:
                  summary: Account is suspended
                  value:
                    error:
                      code: unauthenticated
                      message: This account is suspended. Please contact the Hall Office.
        "429":
          description: |
            Too many sign-in attempts from this client in a short window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many attempts. Try again shortly.
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Exchange a refresh token
      description: |
        Issues a new access token and a new refresh token. The presented refresh
        token is revoked. A revoked, expired, or unknown token is refused.
        Repeated attempts from the same client are limited; further attempts
        return 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: |
            Too many refresh attempts from this client in a short window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Too many attempts. Try again shortly.

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Revokes the caller's refresh tokens.
      responses:
        "204":
          description: Refresh tokens revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: current_user
      summary: Current account
      description: The signed-in user, including the resident or staff profile summary.
      responses:
        "200":
          description: Current account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: change_password
      summary: Change own password
      description: Checks the current password, stores a new hash, and revokes refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/me/home:
    get:
      tags: [Resident]
      operationId: resident_home
      summary: Resident home
      description: |
        Caller: resident. Presence, room, the open outing if there is one, the
        permission the resident is waiting on or cleared to use, and the last
        ten exit and return lines. Does not cancel passed plans or expire
        permissions; call POST /api/v1/me/expire-passed first when the phone
        needs a fresh home screen.
      responses:
        "200":
          description: Home screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentHome"
              example:
                resident:
                  enrolment_number: 24-GLLB-118
                  course: B.A. LL.B. (Hons.)
                  room_label: B-204
                  block_name: Block-B
                  presence: inside
                current_outing: null
                active_permission: null
                recent_history:
                  - event: returned
                    place: Maulana Azad Library
                    occurred_at: "2026-09-12T15:16:00Z"
                    outing_id: 00000000-0000-4000-8000-000000000001
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/hall-pass:
    get:
      tags: [Resident]
      operationId: resident_hall_pass
      summary: Permanent hall pass
      description: |
        Caller: resident. Returns the payload the phone encodes as a QR image.
        The same payload is used to leave and to come back. It changes only when
        the provost reissues it.
      responses:
        "200":
          description: Hall pass payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallPass"
              example:
                qr_payload: bsj:v1:example-token
                full_name: Aisha Khan
                room_label: B-204
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/history:
    get:
      tags: [Resident]
      operationId: resident_history
      summary: Own exit and return history
      description: "Caller: resident. Newest first. Each outing contributes an exit line and, once returned, a return line."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: History page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/destinations:
    get:
      tags: [Resident]
      operationId: list_destinations
      summary: Ordinary outing destinations
      description: |
        Active catalog. Named places are alphabetical, ignoring capitals. The
        free-text choice, Other, is always last. Any signed-in user may read
        it. The provost edits it. A retired destination stays on file and is
        left off this list.
      responses:
        "200":
          description: Active destinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
              example:
                items:
                  - id: 1285f918-cd9c-5ef8-9c04-58a69285211c
                    name: J.N. Medical College
                    is_other: false
                    is_active: true
                  - id: fc2da7c5-8d65-5680-8034-d8acb69745eb
                    name: Maulana Azad Library
                    is_other: false
                    is_active: true
                  - id: 924e5c75-e9b6-57a9-bb04-720028253526
                    name: Shamshad Market
                    is_other: false
                    is_active: true
                  - id: df29c4b7-63c5-525d-a9ec-798a980c64c8
                    name: Women's College
                    is_other: false
                    is_active: true
                  - id: f2008ef3-a1df-5ff0-b936-3466d0914781
                    name: Other
                    is_other: true
                    is_active: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/outings:
    get:
      tags: [Resident]
      operationId: list_outings
      summary: Ordinary outing plans
      description: |
        Caller: resident. Her planned and outside outings, soonest return
        first. Several may fall on the same hall day. A later return today, and
        a later day, stay on this list. The open outing is the one she is
        outside on, or the soonest plan for today. Does not cancel passed
        plans; call POST /api/v1/me/expire-passed (or plan/cancel/scan) first
        when the phone needs a fresh list. Paginated with `limit` and `offset`
        (default limit 50).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Planned and outside outings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Resident]
      operationId: plan_outing
      summary: Plan an ordinary outing
      description: |
        Caller: resident. This is required before an ordinary exit scan. The
        scan does not ask for a destination or an expected return. She may plan
        several returns, including two on the same hall day, such as noon and
        5:00 PM. She may already be outside. Two planned or outside outings
        cannot end at the same instant.

        Sets destination and expected return. Does not record the exit. The gate
        scan does that. No warden approval. Grace is the hall's `grace_minutes`
        added to the expected return, and is returned on the outing so the phone
        can show when the guardian would be told.

        The expected return must be in the future and inside ordinary hours on
        that hall date. The start of the window is not included. The end is
        included. Summer, 1 April through 30 September, is 6:30 AM to 6:30 PM.
        Winter, 1 October through 31 March, is 6:30 AM to 5:30 PM. A return at
        or before the start is outside ordinary hours. A return after the end
        needs late-night permission or home going. When the chosen destination
        is the Other row, `destination_text` is required. A planned outing
        whose expected return has already passed is cancelled by the system,
        with no staff member, before this plan is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanOutingRequest"
            example:
              destination_id: fc2da7c5-8d65-5680-8034-d8acb69745eb
              expected_return_at: "2026-09-30T13:00:00Z"
      responses:
        "201":
          description: Outing planned. Her presence is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `return_already_planned` says she already has an outing ending at
            that time. `outside_ordinary_hours` says that return is outside
            ordinary hours. `permission_required` says that return is outside
            ordinary hours. Please submit a permission request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/me/outings/current:
    get:
      tags: [Resident]
      operationId: current_outing
      summary: Open outing
      description: |
        Caller: resident. The outing she is outside on, or the soonest plan
        whose return falls on today's hall date, or null. A later plan today
        stays on the plan list. A plan for a later day stays there too. Does
        not cancel passed plans; call POST /api/v1/me/expire-passed (or
        plan/cancel/scan) first when the phone needs a fresh open outing. An
        outside outing stays outside. It is late only after grace.
      responses:
        "200":
          description: Open outing, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentOuting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/outings/{outing_id}/cancel:
    post:
      tags: [Resident]
      operationId: cancel_outing
      summary: Cancel a planned outing
      description: |
        Caller: resident. She chooses which plan. Allowed only while that
        outing is `planned`. Other plans stay planned, including another return
        today. An exit that has already
        been scanned is closed by a return scan, not by cancel. A plan whose
        expected return has already passed is cancelled by the system first,
        with no staff member.
      parameters:
        - $ref: "#/components/parameters/OutingId"
      responses:
        "200":
          description: Outing cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `no_outing_planned` says there is no planned outing. `already_outside`
            says she is already outside.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/expire-passed:
    post:
      tags: [Resident]
      operationId: expire_own_passed
      summary: Expire own passed plans and permissions
      description: |
        Caller: resident. Marks this resident's planned ordinary outings whose
        expected return has passed as cancelled, and marks unused approved
        permissions whose expected return has passed as expired. GET routes do
        not perform this work. Safe to call before painting home or lists.
      responses:
        "200":
          description: Counts of rows updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpirePassedResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/permissions:
    get:
      tags: [Permissions]
      operationId: list_own_permissions
      summary: Own special permissions
      description: |
        Caller: resident. Newest first. Includes late-night and home going. Each
        item is a Permission (no resident_id, resident_name, or room_label — the
        caller already is that resident). Does not expire passed permissions;
        call POST /api/v1/me/expire-passed first when the phone needs a fresh
        status.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PermissionStatus"
      responses:
        "200":
          description: Permission page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Permissions]
      operationId: submit_permission
      summary: Request late-night or home going
      description: |
        Caller: resident. A warden or the provost decides later. Also expires this resident's unused approved permissions whose
        expected return has passed. Submitting does
        not let the resident leave. The hall pass can be used for this permission
        only after it is approved and the gate scans it inside the use window.

        `departure_at` must not be in the past. A few minutes of clock skew are
        allowed. There is no maximum how far ahead the departure may be.
        `expected_return_at` must be after `departure_at`. Home going requires
        `short_place`, `address`, and `reason`. Late-night requires `short_place`
        and `reason`, and may include `destination_detail`. `short_place` is
        typed on this form. It is not chosen from the ordinary destination list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionCreate"
            examples:
              late_night:
                value:
                  type: late_night
                  short_place: Women's College
                  destination_detail: Seminar Hall
                  reason: Faculty seminar ends at 9:00 PM. Requesting late return to hall.
                  departure_at: "2026-09-13T13:00:00Z"
                  expected_return_at: "2026-09-13T16:00:00Z"
              home_going:
                value:
                  type: home_going
                  short_place: Lucknow
                  address: 14, Civil Lines, Lucknow, U.P. 226001
                  reason: Family visit. Eid with parents.
                  departure_at: "2026-09-19T02:30:00Z"
                  expected_return_at: "2026-09-21T13:30:00Z"
      responses:
        "201":
          description: Permission is pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/me/permissions/{permission_id}:
    get:
      tags: [Permissions]
      operationId: get_own_permission
      summary: Own permission
      description: |
        Caller: resident. Refuses another resident's permission. Does not expire
        a passed approved permission; call POST /api/v1/me/expire-passed (or a
        write such as cancel) when the phone needs a fresh status.
      parameters:
        - $ref: "#/components/parameters/PermissionId"
      responses:
        "200":
          description: Permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/permissions/{permission_id}/cancel:
    post:
      tags: [Permissions]
      operationId: cancel_permission
      summary: Cancel own permission
      description: |
        Caller: resident. Allowed while `pending` or `approved` and unused at
        the gate (no exit scan; status is not `in_use`). Not allowed once the
        gate has recorded an exit against it.
      parameters:
        - $ref: "#/components/parameters/PermissionId"
      responses:
        "200":
          description: Permission cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `permission_in_use` when the gate has already recorded an exit against
            this permission. Otherwise only pending or approved may be cancelled;
            the message names the current status (`not_cancellable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/guest-stays:
    get:
      tags: [Guest Stays]
      operationId: list_own_guest_stays
      summary: Own guest applications
      description: |
        Caller: resident. Stays this resident is hosting. Newest first. Each
        item is a GuestStaySummary card; open GET by id for the full GuestStay.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Guest stay page of GuestStaySummary cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStayPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Guest Stays]
      operationId: submit_guest_stay
      summary: Apply for a guest stay
      description: |
        Caller: resident. Start date must be at least `guest_min_lead_days`
        after today in Asia/Kolkata (by default, tomorrow or later). Inclusive
        days from start through end must be within `guest_max_inclusive_days`
        (by default, 7). Friday 18 September through Monday 21 September is 4 days.
        Payment is not taken here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestStayCreate"
            example:
              guest_name: Zara Ahmed
              relation: Cousin
              guest_start_date: "2026-09-18"
              guest_end_date: "2026-09-21"
              reason: Family wedding in Aligarh. Staying with Aisha, B-204.
      responses:
        "201":
          description: Guest stay is pending. Payment is unpaid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/me/guest-stays/{guest_stay_id}:
    get:
      tags: [Guest Stays]
      operationId: get_own_guest_stay
      summary: Own guest stay
      description: "Caller: resident, and only for a stay they host."
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Guest stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Guest Stays]
      operationId: edit_guest_stay
      summary: Edit own guest stay
      description: |
        Caller: resident, and only for a stay they host.

        Before arrival (`pending` or `approved`, and arrival not yet recorded):
        send all of `guest_name`, `relation`, `guest_start_date`, `guest_end_date`, and
        `reason` (full replace of those fields). Status, payment, arrival, and
        departure are not editable here.

        After arrival and before departure: only `guest_start_date` and/or `guest_end_date`
        may change. `guest_name`, `relation`, and `reason` are locked once the
        guest has arrived.

        Not editable when the stay is `departed`, `rejected`, or `cancelled`
        (409 `not_editable`).

        Every successful edit returns the stay to `pending`, clears
        `decided_by`, `decided_at`, and `decision_note`, and leaves
        `payment_status` unchanged. A warden or the provost must approve
        again — including when the stay was already approved, and including a
        date change after the guest has arrived. Staff see the stay back in
        the pending queue.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestStayUpdate"
            example:
              guest_name: Zara Ahmed
              relation: Cousin
              guest_start_date: "2026-10-02"
              guest_end_date: "2026-10-06"
              reason: Family wedding in Aligarh. Staying with Aisha, B-204.
      responses:
        "200":
          description: |
            Guest stay updated and returned to pending. Decision fields are
            cleared; payment_status is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The stay cannot be edited (departed, rejected, cancelled, or
            otherwise closed). Code `not_editable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/me/guest-stays/{guest_stay_id}/cancel:
    post:
      tags: [Guest Stays]
      operationId: cancel_guest_stay
      summary: Cancel own guest application
      description: "Caller: resident. Allowed while `pending` or `approved`, and only before arrival is recorded."
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Guest stay cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest has already arrived, or the stay is decided in a terminal way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/gate/scans:
    post:
      tags: [Gate]
      operationId: scan_hall_pass
      summary: Scan a hall pass
      description: |
        Caller: gate, warden, or provost.

        Send the raw QR text. Both `bsj:v1:{token}` and the bare token are accepted.

        While the resident is inside, a scan records an exit. Among ordinary
        outings planned for today's hall date whose expected return has not
        passed, the earliest return is used, and only when the current time is
        inside ordinary hours today. A later return today is left planned. A
        plan for another day is left planned and is not used today. The scan
        records the exit time and the staff member. Otherwise an approved
        permission inside its use window is opened as an outing and marked in
        use. If neither exists, the scan is refused. An ordinary exit needs a
        destination and an expected return saved before the resident reaches
        the gate. If she meant a later trip today, or a permission, she cancels
        the plan the gate would use and shows the pass again.

        While the resident is outside, a scan records the return. Nothing else
        is filled in.

        A second scan inside `scan_duplicate_window_seconds` of the previous
        exit or return for that resident is refused, so one presentation at the
        gate cannot undo itself. The refusal for a fresh exit uses the gate
        copy: the resident is already outside and should present the same pass
        on return.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
            example:
              qr_payload: bsj:v1:example-token
      responses:
        "200":
          description: Exit recorded, or return recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
              examples:
                exit:
                  value:
                    outcome: exit_recorded
                    full_name: Aisha Khan
                    room_label: B-204
                    recorded_at: "2026-09-13T12:42:00Z"
                    message: The resident is now outside.
                return:
                  value:
                    outcome: return_recorded
                    full_name: Aisha Khan
                    room_label: B-204
                    recorded_at: "2026-09-13T13:24:00Z"
                    message: On time. Status is now inside.
                    on_time: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Hall pass not recognised. Code `unknown_hall_pass`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `duplicate_scan`, `no_outing_planned`, `outside_ordinary_hours`,
            `permission_not_yet_valid`, `open_outing_exists`,
            `resident_suspended`, or `return_already_planned`. The body includes
            the resident name and room when the pass is known, so the gate
            screen can say what to do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: duplicate_scan
                  message: This resident is already recorded as outside (exit 8:14 PM). Ask the resident to present the same hall pass on return. The register already has an exit.
                  details:
                    full_name: Aisha Khan
                    room_label: B-204
                    presence: outside

  /api/v1/gate/activity:
    get:
      tags: [Gate]
      operationId: gate_activity
      summary: Recent gate activity
      description: |
        Caller: gate, warden, or provost. Newest first. Lines are resident exits,
        resident returns, guest arrivals, and guest departures.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Activity page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateActivityPage"
              examples:
                resident_exit:
                  summary: Resident exit
                  value:
                    total: 3
                    limit: 50
                    offset: 0
                    items:
                      - event: exit
                        occurred_at: "2026-09-13T14:39:00Z"
                        resident_name: Zoya Siddiqui
                        room_label: A-118
                        guest_name: null
                        host_name: null
                        host_room_label: null
                guest_arrival:
                  summary: Guest arrival
                  value:
                    total: 3
                    limit: 50
                    offset: 0
                    items:
                      - event: guest_arrival
                        occurred_at: "2026-09-18T10:11:00Z"
                        resident_name: null
                        room_label: null
                        guest_name: Fatima Begum
                        host_name: Aisha Khan
                        host_room_label: B-204
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/v1/gate/occupancy:
    get:
      tags: [Gate]
      operationId: gate_occupancy
      summary: Guest dining occupancy at the gate
      description: |
        Caller: gate, warden, or provost. Hall-wide guest dining counts for the
        gate home strip. `guests_in_hall_count` is every stay that has arrived
        and has not departed (includes should-have-left).
        `guests_should_have_left_count` is the subset whose hall date is after
        `guest_end_date`. This is not the full register presence board; use
        `GET /api/v1/register/summary` for resident inside/outside/late counts.
      responses:
        "200":
          description: Dining occupancy counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateOccupancy"
              example:
                guests_in_hall_count: 2
                guests_should_have_left_count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/gate/guests:
    get:
      tags: [Gate]
      operationId: gate_guests
      summary: Guests for the gate
      description: |
        Caller: gate, warden, or provost. Buckets are timing-based. `expected` is
        approved, not yet arrived, and the hall date is inside the stay.
        `in_hall` includes guests who should already have left, because departure
        is still recorded here. Optional `payment_status` is a separate axis
        (`paid` or `unpaid`); omit it to return every guest that matches the
        bucket.
      parameters:
        - name: bucket
          in: query
          required: true
          schema:
            type: string
            enum: [expected, in_hall]
        - name: payment_status
          in: query
          required: false
          description: |
            When set, keep only guests with that payment status. Omit to include
            both paid and unpaid for the chosen bucket.
          schema:
            type: string
            enum: [paid, unpaid]
      responses:
        "200":
          description: Guest cards for the gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateGuestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/gate/guests/{guest_stay_id}/arrival:
    post:
      tags: [Gate]
      operationId: record_guest_arrival
      summary: Record guest arrival
      description: |
        Caller: gate, warden, or provost. The stay must be approved, paid, not
        yet arrived, and today's hall date must fall within the stay. Guests are
        not scanned.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Arrival recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestMovementResult"
              example:
                guest_name: Zara Ahmed
                host_name: Aisha Khan
                host_room_label: B-204
                recorded_at: "2026-09-18T10:11:00Z"
                message: The guest is now in the hall.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`guest_not_expected` or `payment_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/gate/guests/{guest_stay_id}/departure:
    post:
      tags: [Gate]
      operationId: record_guest_departure
      summary: Record guest departure
      description: |
        Caller: gate, warden, or provost. The guest must currently be in the hall.
        Closes the stay. Departure is still recorded when the end date has
        already passed.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Departure recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestMovementResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest is not in the hall. Code `guest_not_in_hall`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/register/summary:
    get:
      tags: [Register]
      operationId: register_summary
      summary: Hall register counts
      description: |
        Caller: warden or provost. Counts for the whole hall, and the same counts
        for each block. A resident is counted in the block of her current room.
        A guest is counted in the host's block. The hall totals are the sum of
        the blocks.
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSummary"
              example:
                inside_count: 186
                outside_count: 22
                late_count: 3
                pending_permission_count: 4
                guests_in_hall_count: 6
                guests_should_have_left_count: 1
                pending_guest_stay_count: 2
                blocks:
                  - block_id: 00000000-0000-4000-8000-0000000000b1
                    code: B
                    name: Block-B
                    inside_count: 40
                    outside_count: 6
                    late_count: 1
                    pending_permission_count: 1
                    guests_in_hall_count: 2
                    guests_should_have_left_count: 0
                    pending_guest_stay_count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/register/residents:
    get:
      tags: [Register]
      operationId: list_register
      summary: Resident register
      description: |
        Caller: warden or provost. Search matches full name or room label.
        `block_id` limits the list to one block. `state=late` is outside and
        past grace. Results are ordered by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Name or room.
          schema:
            type: string
            maxLength: 80
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RegisterState"
        - name: block_id
          in: query
          required: false
          description: Limit the list to residents whose current room is in this block.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Register page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/register/residents/{resident_id}:
    get:
      tags: [Register]
      operationId: register_resident
      summary: Resident record
      description: |
        Caller: warden or provost. The open outside outing when she is outside
        (status `outside`), or null when she is inside. Cancelled, returned, and
        planned outings are not returned here. The outing may be ordinary or a
        permission. Whether the guardian was told is included.
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: Resident record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/register/late:
    get:
      tags: [Register]
      operationId: late_list
      summary: Late list
      description: |
        Caller: warden or provost. Residents still outside after grace.
        Parent SMS has been sent where a number is on file.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Late page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/permissions:
    get:
      tags: [Permissions]
      operationId: list_permissions
      summary: Permission queue
      description: |
        Caller: warden or provost. Defaults to `pending`. Ordered by
        `created_at`, newest first (`order=newest`). Pass `order=oldest` for
        oldest first. Optional filters narrow the page: `block_id` is the block
        of the resident's current room; `type` is late-night or home going;
        `created_from` and `created_to` are inclusive UTC bounds on
        `created_at`. Each item is a PermissionReview (includes resident
        identity). Does not expire passed permissions; call
        POST /api/v1/permissions/expire-passed first when the queue needs a
        fresh status.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to pending when omitted.
          schema:
            $ref: "#/components/schemas/PermissionStatus"
        - name: type
          in: query
          required: false
          description: Limit to late-night or home-going permissions.
          schema:
            $ref: "#/components/schemas/PermissionType"
        - name: block_id
          in: query
          required: false
          description: >
            Limit to residents whose current room is in this block.
          schema:
            type: string
            format: uuid
        - name: created_from
          in: query
          required: false
          description: Inclusive lower bound on created_at (UTC instant).
          schema:
            type: string
            format: date-time
            example: "2026-09-30T00:00:00Z"
        - name: created_to
          in: query
          required: false
          description: Inclusive upper bound on created_at (UTC instant).
          schema:
            type: string
            format: date-time
            example: "2026-09-30T23:59:59Z"
        - name: order
          in: query
          required: false
          description: Sort by created_at. Default newest.
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Permission page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionReviewPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/permissions/expire-passed:
    post:
      tags: [Permissions]
      operationId: expire_passed_permissions
      summary: Expire passed unused permissions
      description: |
        Caller: warden or provost. Marks every unused approved permission whose
        expected return has passed as expired. GET queue and GET-by-id do not
        perform this work. Safe to call before opening the queue.
      responses:
        "200":
          description: Count of permissions updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpirePassedPermissionsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/permissions/{permission_id}:
    get:
      tags: [Permissions]
      operationId: get_permission
      summary: Permission for review
      description: |
        Caller: warden or provost. Does not expire a passed approved permission;
        call POST /api/v1/permissions/expire-passed first when review needs a
        fresh status.
      parameters:
        - $ref: "#/components/parameters/PermissionId"
      responses:
        "200":
          description: Permission, including the resident's name and room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/permissions/{permission_id}/decision:
    post:
      tags: [Permissions]
      operationId: decide_permission
      summary: Approve or reject a permission
      description: |
        Caller: warden or provost. Only a `pending` permission can be decided.
        Before deciding, expires this permission if it is an unused approved
        request whose expected return has already passed. Approval does not
        create an outing and does not by itself let a scan succeed before the
        use window. Rejection leaves ordinary outings available.
      parameters:
        - $ref: "#/components/parameters/PermissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            example:
              decision: approved
              note: ""
      responses:
        "200":
          description: Decision stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Only a pending permission can be approved or rejected. The message
            names the current status. Code `not_pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/guest-stays:
    get:
      tags: [Guest Stays]
      operationId: list_guest_stays
      summary: Guest stays
      description: |
        Caller: warden or provost. Filter by derived bucket. `in_hall` here is
        the dining set and includes guests who should have left. Use
        `should_have_left` for that subset. By default the list omits terminal
        buckets `cancelled` and `rejected` so the warden queue stays clean.
        Pass `include_terminal=true` to include those rows. An explicit
        `bucket=cancelled` or `bucket=rejected` still returns that subset
        without needing `include_terminal`. Each item is a GuestStaySummary
        card; open GET by id for the full GuestStay.
      parameters:
        - name: bucket
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GuestBucket"
        - name: include_terminal
          in: query
          required: false
          description: |
            When false (default), omit buckets `cancelled` and `rejected`
            unless `bucket` is set to one of those values. When true, include
            terminal rows (still subject to `bucket` when set).
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Guest stay page of GuestStaySummary cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStayPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/guest-stays/{guest_stay_id}:
    get:
      tags: [Guest Stays]
      operationId: get_guest_stay
      summary: Guest stay for review
      description: "Caller: warden or provost."
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      responses:
        "200":
          description: Guest stay, including the host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/guest-stays/{guest_stay_id}/decision:
    post:
      tags: [Guest Stays]
      operationId: decide_guest_stay
      summary: Approve or reject a guest stay
      description: |
        Caller: warden or provost. Only while `pending`. A resident edit returns
        an approved stay (and a post-arrival date change) to pending, so staff
        must decide again. When the guest has already arrived, only `approved`
        is allowed — reject is refused (the guest is in the hall). Approval does
        not mark payment and does not clear or set arrival.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not pending. Code `not_pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/guest-stays/{guest_stay_id}/payment:
    post:
      tags: [Guest Stays]
      operationId: mark_guest_payment
      summary: Mark guest payment
      description: |
        Caller: warden or provost. Records that the hall office has or has not
        taken payment outside the system. Allowed before arrival, whether the
        stay is pending or approved. The app does not collect money. When
        marking paid, `payment_note` is required (off-system proof such as a
        transaction reference, who collected cash, or a screenshot mention).
        When marking unpaid, `payment_note` is optional and any stored note is
        cleared together with the payment staff member and time.
      parameters:
        - $ref: "#/components/parameters/GuestStayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
            example:
              payment_status: paid
              payment_note: "UPI ref TXN123456; collected at desk"
      responses:
        "200":
          description: Payment status stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The guest has already arrived or the stay is closed. Code `payment_locked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/residents:
    get:
      tags: [Hall office]
      operationId: admin_list_residents
      summary: List resident accounts
      description: "Caller: provost. Includes suspended residents. Does not include hall-pass tokens."
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Resident account page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentAccountPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: admin_create_resident
      summary: Create a resident
      description: |
        Caller: provost. Username is the enrolment number. The response includes
        the hall pass payload once, so the office can place it on the resident's
        phone. Later reads of the account do not return the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentCreate"
      responses:
        "201":
          description: Resident created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Enrolment number already in use. Code `duplicate_username`.
            That room is not in use. Code `room_inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/residents/{resident_id}:
    get:
      tags: [Hall office]
      operationId: admin_get_resident
      summary: Resident account
      description: "Caller: provost. No hall-pass token."
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: Resident account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Hall office]
      operationId: admin_update_resident
      summary: Update a resident
      description: |
        Caller: provost. Send only the fields that change. `course` may be set
        to null to clear it. `guardian_name` and `guardian_phone` may be
        replaced and may not be cleared. A phone includes the country code.
        Changing `enrolment_number` changes the username. `status` suspends or
        reinstates the account and revokes refresh tokens on suspension.
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentUpdate"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Enrolment number already in use. Code `duplicate_username`.
            That room is not in use. Code `room_inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/residents/{resident_id}/hall-pass/reissue:
    post:
      tags: [Hall office]
      operationId: reissue_hall_pass
      summary: Reissue a hall pass
      description: |
        Caller: provost. Replaces the token immediately. The previous QR stops
        working. The new payload is returned once.
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: New hall pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallPass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/staff:
    get:
      tags: [Hall office]
      operationId: admin_list_staff
      summary: List staff accounts
      description: "Caller: provost. Gate, warden, and provost accounts."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Staff page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: admin_create_staff
      summary: Create a staff account
      description: "Caller: provost. Role is gate, warden, or provost. The sample body leaves the temporary password out of this repository. The field is required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreate"
            example:
              full_name: Imran Qureshi
              username: imran.qureshi
              role: gate
              job_title: Gatekeeper
      responses:
        "201":
          description: Staff account created. The password is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already in use. Code `duplicate_username`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/staff/{user_id}:
    patch:
      tags: [Hall office]
      operationId: admin_update_staff
      summary: Update a staff account
      description: |
        Caller: provost. Role cannot be changed on this route, and a staff
        account cannot become a resident. Suspension revokes refresh tokens.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{user_id}/password:
    post:
      tags: [Hall office]
      operationId: reset_password
      summary: Reset a password
      description: |
        Caller: provost. Sets a temporary password and revokes that user's
        refresh tokens. Works for residents and staff.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password reset.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/blocks:
    get:
      tags: [Hall office]
      operationId: list_blocks
      summary: List blocks
      description: "Caller: provost. Includes inactive blocks."
      responses:
        "200":
          description: Blocks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: create_block
      summary: Create a block
      description: "Caller: provost. `code` is the short label used in room names, such as B."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: Block created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Code already in use. Code `duplicate_block`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/blocks/{block_id}:
    patch:
      tags: [Hall office]
      operationId: update_block
      summary: Update a block
      description: "Caller: provost. Deactivate with `is_active` false. Rooms in the block remain."
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdate"
      responses:
        "200":
          description: Block updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/rooms:
    get:
      tags: [Hall office]
      operationId: list_rooms
      summary: List rooms
      description: "Caller: provost."
      parameters:
        - name: block_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: create_room
      summary: Create a room
      description: |
        Caller: provost. `label` is stored as `{block code}-{number}`. The number
        is text, so `087` stays `087`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreate"
            example:
              block_id: 00000000-0000-4000-8000-0000000000b1
              number: "204"
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That number is already used in the block. Code `duplicate_room`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/rooms/{room_id}:
    patch:
      tags: [Hall office]
      operationId: update_room
      summary: Update a room
      description: "Caller: provost. A room with residents assigned to it can be deactivated only after they are moved."
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Room updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Residents are still assigned. Code `room_in_use`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/destinations:
    get:
      tags: [Hall office]
      operationId: admin_list_destinations
      summary: List destinations
      description: "Caller: provost. Includes inactive rows. Named places are alphabetical, ignoring capitals. The free-text choice is last. The resident catalog route returns active rows only."
      responses:
        "200":
          description: Destinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Hall office]
      operationId: create_destination
      summary: Create a destination
      description: |
        Caller: provost. Only one active destination may have `is_other` true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationCreate"
      responses:
        "201":
          description: Destination created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`duplicate_destination` or `other_exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/destinations/{destination_id}:
    patch:
      tags: [Hall office]
      operationId: update_destination
      summary: Update a destination
      description: "Caller: provost. Deactivating a destination does not change the place already stored on an outing."
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Destination updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another active Other row exists. Code `other_exists`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/settings:
    get:
      tags: [Hall office]
      operationId: get_settings
      summary: Hall settings
      description: "Caller: provost. Clock times are hall-local HH:MM. Season starts are MM-DD. Clients show both on a 12-hour clock and as a day and month."
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Hall office]
      operationId: update_settings
      summary: Update hall settings
      description: |
        Caller: provost. Send only the fields that change. Summer hours, winter
        hours, and the two season start dates are always set. Changing grace
        does not rewrite outings that already have a `grace_ends_at`. SMS
        templates keep the placeholders listed on `HallSettings`. A time of day
        is sent as HH:MM. A season start is sent as MM-DD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HallSettingsUpdate"
      responses:
        "200":
          description: Settings saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/register/export:
    get:
      tags: [Hall office]
      operationId: export_register
      summary: Export the register
      description: |
        Caller: provost. One CSV file. UTF-8, comma separated, header row required.
        Resident rows and guest rows share one header. Cells that do not apply
        to the row are empty.

        Header, in this order:

        `record_type,full_name,enrolment_number,room_label,block_code,course,presence,state,place,exited_at,expected_return_at,grace_ends_at,returned_at,outing_type,guardian_name,guardian_phone,guest_name,relation,host_name,host_room_label,guest_start_date,guest_end_date,payment_status,guest_bucket,arrived_at,departed_at`

        `record_type` is `resident` or `guest`. Instants are UTC. Dates are
        YYYY-MM-DD. This export contains guardian phone numbers and is not a
        warden route. `block_code` is the resident's block, or the host's block
        on a guest row. A data cell whose text starts with `=`, `+`, `-`, `@`,
        a tab, or a carriage return is prefixed with one single quote so a
        spreadsheet keeps the text. The header row is not prefixed. Other text
        is unchanged.
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/sms:
    get:
      tags: [Hall office]
      operationId: list_sms
      summary: SMS log
      description: "Caller: provost. Newest first. Each row is a late notice or a return notice sent to the guardian phone."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: SMS page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/audit:
    get:
      tags: [Hall office]
      operationId: list_audit
      summary: Audit log
      description: "Caller: provost. Newest first. Detail never contains a password, a refresh token, or a hall-pass token."
      parameters:
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ResidentId:
      name: resident_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutingId:
      name: outing_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuestStayId:
      name: guest_stay_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DestinationId:
      name: destination_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: The access token is missing or expired, or the username and password were refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Sign in again.
    Forbidden:
      description: The signed-in role cannot call this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: This account cannot do that.
    NotFound:
      description: No record with that id is visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: That record was not found.
    Unprocessable:
      description: The JSON is the wrong shape, or a field fails a constraint that does not depend on existing rows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_error
              message: Expected return must be after departure.
              details:
                field: expected_return_at

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      additionalProperties: false
      required: [status, user_version]
      properties:
        status:
          type: string
          enum: [ready]
        user_version:
          type: integer
          minimum: 0
          description: SQLite PRAGMA user_version after migrations.


    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine code. Known codes: `unauthenticated`, `rate_limited`, `not_ready`, `forbidden`,
            `not_found`, `validation_error`, `duplicate_username`,
            `duplicate_block`, `duplicate_room`, `duplicate_destination`,
            `room_in_use`, `room_inactive`, `other_exists`, `already_outside`, `return_already_planned`,
            `open_outing_exists`,
            `outside_ordinary_hours`, `permission_required`, `no_outing_planned`,
            `permission_not_yet_valid`,
            `duplicate_scan`, `resident_suspended`, `unknown_hall_pass`,
            `not_pending`, `permission_in_use`, `not_cancellable`, `not_editable`, `guest_not_expected`, `guest_not_in_hall`,
            `payment_required`, `payment_locked`.
        message:
          type: string
          description: Sentence the phone can show. Not a stack trace.
        details:
          type: object
          additionalProperties: true

    ListMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 200

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
