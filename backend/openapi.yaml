          format: uuid
        full_name:
          type: string
        room_label:
          type: string
        presence:
          $ref: "#/components/schemas/Presence"
        state:
          $ref: "#/components/schemas/RegisterState"
        outside_destination:
          oneOf:
            - type: string
            - type: "null"
          description: Place on the open outing. Empty when the resident is inside.
        expected_return_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        returned_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    RegisterPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RegisterRow"

    GuardianNotice:
      type: string
      enum: [not_due, sent, failed]
      description: Whether the guardian has been told about the open outing.

    ResidentRecord:
      type: object
      additionalProperties: false
      required: [id, full_name, enrolment_number, room_label, presence, state, guardian_name, guardian_notice]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        enrolment_number:
          type: string
        course:
          oneOf:
            - type: string
            - type: "null"
        room_label:
          type: string
        presence:
          $ref: "#/components/schemas/Presence"
        state:
          $ref: "#/components/schemas/RegisterState"
        outing:
          oneOf:
            - $ref: "#/components/schemas/Outing"
            - type: "null"
          description: >
            The open outing with status outside, or null when the resident is
            inside. Cancelled, returned, and planned outings are omitted.
        guardian_name:
          type: string
          description: Parent or guardian the hall contacts.
        guardian_notice:
          $ref: "#/components/schemas/GuardianNotice"

    ResidentAccount:
      type: object
      additionalProperties: false
      required: [id, full_name, enrolment_number, room_id, room_label, guardian_name, guardian_phone, status, presence]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        enrolment_number:
          type: string
        course:
          oneOf:
            - type: string
            - type: "null"
        room_id:
          type: string
          format: uuid
        room_label:
          type: string
        guardian_name:
          type: string
        guardian_phone:
          type: string
          description: E.164, country code required.
        status:
          $ref: "#/components/schemas/AccountStatus"
        presence:
          $ref: "#/components/schemas/Presence"
          description: Inside or outside the hall. Changes when a gate scan records an exit or a return. This is not sign-in.

    ResidentAccountPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResidentAccount"

    ResidentCreate:
      type: object
      additionalProperties: false
      required: [full_name, enrolment_number, room_id, guardian_name, guardian_phone, temporary_password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        enrolment_number:
          type: string
          minLength: 1
          maxLength: 40
        course:
          type: string
          maxLength: 120
        room_id:
          type: string
          format: uuid
        guardian_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Parent or guardian. Required.
        guardian_phone:
          type: string
          description: E.164 with country code, for example +919876543210.
          pattern: "^\\+[1-9][0-9]{7,14}$"
        temporary_password:
          type: string
          minLength: 10
          maxLength: 200

    ResidentCreated:
      type: object
      additionalProperties: false
      required: [account, hall_pass]
      properties:
        account:
          $ref: "#/components/schemas/ResidentAccount"
        hall_pass:
          $ref: "#/components/schemas/HallPass"

    ResidentUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        enrolment_number:
          type: string
          minLength: 1
          maxLength: 40
        course:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
        room_id:
          type: string
          format: uuid
        guardian_name:
          type: string
          minLength: 1
          maxLength: 120
        guardian_phone:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
        status:
          $ref: "#/components/schemas/AccountStatus"

    StaffAccount:
      type: object
      additionalProperties: false
      required: [id, full_name, username, role, job_title, status]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        job_title:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"

    StaffPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StaffAccount"

    StaffCreate:
      type: object
      additionalProperties: false
      required: [full_name, username, role, job_title, temporary_password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: "#/components/schemas/StaffRole"
        job_title:
          type: string
          minLength: 1
          maxLength: 80
          description: Name of the post. Gate staff scan. A warden or the provost approves. The provost also keeps hall records.
        temporary_password:
          type: string
          minLength: 10
          maxLength: 200

    StaffUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        job_title:
          type: string
          minLength: 1
          maxLength: 80
        status:
          $ref: "#/components/schemas/AccountStatus"

    Block:
      type: object
      additionalProperties: false
      required: [id, code, name, floors, room_count, beds_per_room, is_active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Short code used in room labels. Utility has no letter on the hall page, so its code is Utility.
        name:
          type: string
        floors:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: A, B, C, and D have 4. The hall page does not state a floor count for Utility.
        room_count:
          type: integer
          description: Published room count for this block. Block-A 50, Block-B 58, Block-C 42, Block-D 40, Utility 16.
        beds_per_room:
          type: integer
          description: The hall page states a room capacity of 2.
        is_active:
          type: boolean

    BlockCreate:
      type: object
      additionalProperties: false
      required: [code, name, room_count, beds_per_room]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 80
        floors:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 20
            - type: "null"
        room_count:
          type: integer
          minimum: 1
          maximum: 500
        beds_per_room:
          type: integer
          minimum: 1
          maximum: 6

    BlockUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        floors:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 20
            - type: "null"
        room_count:
          type: integer
          minimum: 1
          maximum: 500
        beds_per_room:
          type: integer
          minimum: 1
          maximum: 6
        is_active:
          type: boolean

    Room:
      type: object
      additionalProperties: false
      required: [id, block_id, number, label, bed_count, is_active]
      properties:
        id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
        number:
          type: string
          description: Door number, kept as written. The hall page does not publish door numbers.
        label:
          type: string
          example: B-204
        bed_count:
          type: integer
          description: Copied from the block when the room is created. Active residents assigned here, including a suspended resident who has not moved, cannot exceed this.
        is_active:
          type: boolean

    RoomCreate:
      type: object
      additionalProperties: false
      required: [block_id, number]
      properties:
        block_id:
          type: string
          format: uuid
        number:
          type: string
          minLength: 1
          maxLength: 12

    RoomUpdate:
      type: object
      additionalProperties: false
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 12
        bed_count:
          type: integer
          minimum: 1
          maximum: 6
        is_active:
          type: boolean

    HallSettings:
      type: object
      additionalProperties: false
      required:
        - hall_name
        - university_name
        - timezone
        - grace_minutes
        - summer_hours_start
        - summer_hours_end
        - winter_hours_start
        - winter_hours_end
        - summer_season_start
        - winter_season_start
        - permission_early_minutes
        - guest_max_inclusive_days
        - guest_min_lead_days
        - scan_duplicate_window_seconds
        - late_sms_template
        - return_sms_template
      properties:
        hall_name:
          type: string
        university_name:
          type: string
        timezone:
          type: string
          example: Asia/Kolkata
        grace_minutes:
          type: integer
        summer_hours_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Kept as HH:MM. Shown as 6:30 AM. Starts as 06:30.
          example: "06:30"
        summer_hours_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Kept as HH:MM. Shown as 6:30 PM. Starts as 18:30.
          example: "18:30"
        winter_hours_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Kept as HH:MM. Shown as 6:30 AM. Starts as 06:30.
          example: "06:30"
        winter_hours_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Kept as HH:MM. Shown as 5:30 PM. Starts as 17:30.
          example: "17:30"
        summer_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          description: Month and day summer hours begin. Shown as 01 April. Starts as 04-01.
          example: "04-01"
        winter_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          description: Month and day winter hours begin. Shown as 01 October. Starts as 10-01.
          example: "10-01"
        permission_early_minutes:
          type: integer
        guest_max_inclusive_days:
          type: integer
        guest_min_lead_days:
          type: integer
        scan_duplicate_window_seconds:
          type: integer
        late_sms_template:
          type: string
          description: "Placeholders: {resident_name}, {room}, {expected_return_local}, {hall_name}."
        return_sms_template:
          type: string
          description: "Placeholders: {resident_name}, {room}, {returned_at_local}, {hall_name}."

    HallSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        hall_name:
          type: string
          minLength: 1
          maxLength: 160
        university_name:
          type: string
          minLength: 1
          maxLength: 160
        grace_minutes:
          type: integer
          minimum: 0
          maximum: 180
        summer_hours_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        summer_hours_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        winter_hours_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        winter_hours_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        summer_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
        winter_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
        permission_early_minutes:
          type: integer
          minimum: 0
          maximum: 180
        guest_max_inclusive_days:
          type: integer
          minimum: 1
          maximum: 30
        guest_min_lead_days:
          type: integer
          minimum: 0
          maximum: 14
        scan_duplicate_window_seconds:
          type: integer
          minimum: 0
          maximum: 600
        late_sms_template:
          type: string
          minLength: 1
        return_sms_template:
          type: string
          minLength: 1

    SmsMessage:
      type: object
      additionalProperties: false
      description: |
        Provost SMS log row. Transport vendor is not part of the public contract.
      required: [id, outing_id, resident_id, notice_type, recipient_phone, body, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        outing_id:
          type: string
          format: uuid
        resident_id:
          type: string
          format: uuid
        resident_name:
          type: string
        notice_type:
          type: string
          enum: [late_notice, return_notice]
          description: Late notice, or return notice.
        recipient_phone:
          type: string
          description: Guardian phone copied at send time. Country code required.
          pattern: "^\\+[1-9][0-9]{7,14}$"
        body:
          type: string
          description: Filled message. Times are described for display as 12-hour; this body is the text that was sent.
        status:
          type: string
          enum: [sent, failed]
        created_at:
          type: string
          format: date-time

    SmsPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SmsMessage"

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, action, entity_type, entity_id, summary]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_user_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        actor_name:
          oneOf:
            - type: string
            - type: "null"
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        summary:
          type: string

    AuditPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
