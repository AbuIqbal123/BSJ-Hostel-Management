          format: uuid
        permission_type:
          $ref: "#/components/schemas/PermissionType"
        status:
          $ref: "#/components/schemas/PermissionStatus"
        short_place:
          type: string
        destination_detail:
          oneOf:
            - type: string
            - type: "null"
        address:
          oneOf:
            - type: string
            - type: "null"
        reason:
          type: string
        departure_at:
          type: string
          format: date-time
        expected_return_at:
          type: string
          format: date-time
        decision_note:
          oneOf:
            - type: string
            - type: "null"
        decided_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        decided_by:
          oneOf:
            - type: string
            - type: "null"
          description: Display name of the provost who decided. Not a user id. Empty while waiting.
          example: Sara Malik
        created_at:
          type: string
          format: date-time

    PermissionReview:
      allOf:
        - $ref: "#/components/schemas/Permission"
        - type: object
          required: [resident_id, resident_name, room_label]
          properties:
            resident_id:
              type: string
              format: uuid
            resident_name:
              type: string
            room_label:
              type: string

    PermissionPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Permission"
              description: Resident own-list cards. No resident_id/name/room on each row.

    PermissionReviewPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PermissionReview"
              description: Staff queue rows, including host resident identity.

    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        note:
          type: string
          maxLength: 500

    GuestBucket:
      type: string
      enum: [pending, upcoming, expected, not_expected, in_hall, should_have_left, departed, rejected, cancelled]

    GuestStayCreate:
      type: object
      additionalProperties: false
      required: [guest_name, relation, guest_start_date, guest_end_date, reason]
      properties:
        guest_name:
          type: string
          minLength: 1
          maxLength: 120
        relation:
          type: string
          minLength: 1
          maxLength: 80
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    GuestStayUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Editable fields for PATCH own guest stay. Only while the stay is pending
        and before arrival. Send all five fields (full replace of name, relation,
        dates, and reason). The stay stays pending and the decision stays empty;
        payment_status is left unchanged. An approved stay, and any stay after
        arrival, is refused.
      properties:
        guest_name:
          type: string
          minLength: 1
          maxLength: 120
        relation:
          type: string
          minLength: 1
          maxLength: 80
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    GuestStay:
      type: object
      additionalProperties: false
      required:
        - id
        - host_resident_id
        - host_name
        - host_room_label
        - guest_name
        - relation
        - guest_start_date
        - guest_end_date
        - inclusive_days
        - reason
        - status
        - payment_status
        - bucket
        - created_at
      properties:
        id:
          type: string
          format: uuid
        host_resident_id:
          type: string
          format: uuid
        host_name:
          type: string
        host_room_label:
          type: string
        guest_name:
          type: string
        relation:
          type: string
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        inclusive_days:
          type: integer
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, cancelled, departed]
        payment_status:
          type: string
          enum: [unpaid, paid]
        payment_note:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Off-system payment proof (transaction reference, who collected cash,
            screenshot mention, and similar). Set when payment is marked paid;
            null when unpaid.
        bucket:
          $ref: "#/components/schemas/GuestBucket"
        decision_note:
          oneOf:
            - type: string
            - type: "null"
        decided_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: UUID of the provost who decided. Empty while waiting, and empty if the resident cancels before a decision. Set once the provost approves or rejects.
        arrived_recorded_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: UUID of the staff member who recorded arrival. Empty until arrival is recorded.
        departed_recorded_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: UUID of the staff member who recorded departure. Empty until departure is recorded.
        arrived_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        departed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        payment_evidence_original_name:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Original client filename when optional payment evidence was uploaded.
            Empty when no evidence is stored. Never a filesystem path.
        payment_evidence_content_type:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Stored content type when evidence exists (`image/jpeg`, `image/png`,
            or `application/pdf`). Empty when no evidence is stored.
        payment_evidence_uploaded_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: UTC instant when evidence was last uploaded. Empty when none.
        payment_evidence_uploaded_by:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: |
            UUID of the warden or provost who uploaded the evidence.
            Empty when no evidence is stored.
        created_at:
          type: string
          format: date-time

    GuestStaySummary:
      type: object
      additionalProperties: false
      description: |
        Card fields for guest-stay list rows. Full stay detail (reason, decision
        note, decided_by / recorder staff ids, arrival/departure instants) is on
        GuestStay via GET by id.
      required:
        - id
        - guest_name
        - host_name
        - host_room_label
        - guest_start_date
        - guest_end_date
        - status
        - payment_status
        - bucket
      properties:
        id:
          type: string
          format: uuid
        guest_name:
          type: string
        host_name:
          type: string
        host_room_label:
          type: string
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, approved, rejected, cancelled, departed]
        payment_status:
          type: string
          enum: [unpaid, paid]
        bucket:
          $ref: "#/components/schemas/GuestBucket"

    GuestStayPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GuestStaySummary"

    PaymentRequest:
      type: object
      additionalProperties: false
      required: [payment_status]
      description: |
        Marks guest-stay payment that happened outside the system. `payment_note`
        is required when `payment_status` is `paid` (non-empty after trim; max
        500). When `payment_status` is `unpaid`, `payment_note` may be omitted or
        empty; any stored note is cleared with `payment_marked_by` and
        `payment_marked_at`, and any optional payment evidence.
      properties:
        payment_status:
          type: string
          enum: [paid, unpaid]
        payment_note:
          type: string
          maxLength: 500
          description: |
            Off-system payment proof for the hall office (transaction reference,
            who collected cash, screenshot mention, and similar). Required when
            marking paid. Optional when marking unpaid; cleared on unpaid.

    ScanRequest:
      type: object
      additionalProperties: false
      required: [qr_payload]
      properties:
        qr_payload:
          type: string
          minLength: 1
          maxLength: 300
          description: Raw QR text, either `bsj:v1:{token}` or the token alone.

    ScanReturnTimeliness:
      type: string
      enum: [on_time, within_grace, late]
      description: |
        How the return sits against expected return and grace.
        `on_time`: at or before `expected_return_at`.
        `within_grace`: after expected return, at or before `grace_ends_at`.
        `late`: after `grace_ends_at`.

    ScanExitOuting:
      type: object
      additionalProperties: false
      description: |
        Exit nest for the scan response. Explicit property list (not allOf
        Outing). Includes outing `lateness` (`on_time` or `late`). Omits
        `return_timeliness`, which is only on a return.
      required:
        - id
        - outing_type
        - status
        - place
        - expected_return_at
        - grace_ends_at
        - lateness
        - created_at
        - recorded_at
      properties:
        id:
          type: string
          format: uuid
        permission_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        outing_type:
          $ref: "#/components/schemas/OutingType"
        status:
          $ref: "#/components/schemas/OutingStatus"
          description: Outing lifecycle status (typically `outside` on exit).
        place:
          type: string
        expected_return_at:
          type: string
          format: date-time
        grace_ends_at:
          type: string
          format: date-time
        exited_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        exit_recorded_by_name:
          oneOf:
            - type: string
            - type: "null"
        returned_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        return_recorded_by_name:
          oneOf:
            - type: string
            - type: "null"
        lateness:
          type: string
          enum: [on_time, late]
          description: |
            For a planned or outside outing, `late` when now is after `grace_ends_at`;
            otherwise `on_time`. Returned and cancelled outings keep the value at read time.
        created_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
          description: When this exit was recorded at the gate (UTC).

    ScanReturnRecord:
      type: object
      additionalProperties: false
      required:
        - recorded_at
        - return_timeliness
        - returned_at
        - return_recorded_by_name
        - outing_type
        - place
        - expected_return_at
        - minutes_late
      properties:
        recorded_at:
          type: string
          format: date-time
          description: When this return was recorded at the gate (UTC).
        return_timeliness:
          $ref: "#/components/schemas/ScanReturnTimeliness"
        returned_at:
          type: string
          format: date-time
        return_recorded_by_name:
          type: string
          description: Staff member who scanned the return.
        outing_type:
          type: string
          enum: [ordinary, late_night, home_going]
          description: Kind of the outing that just ended. Same values as the exit `outing.outing_type` and late-returns `source`.
        place:
          type: string
          description: Where she went (the outing's `place`).
        expected_return_at:
          type: string
          format: date-time
          description: When she was due back (UTC). Same instant as late-returns `due_at`.
        minutes_late:
          type: integer
          minimum: 0
          description: |
            Never null. Same rule as late returns: 0 unless `return_timeliness`
            is `late` (returned after `grace_ends_at`). When late, whole minutes
            from `expected_return_at` to `returned_at`, rounded down.

    ScanExitResult:
      type: object
      additionalProperties: false
      required: [outcome, full_name, room_label, message, outing]
      properties:
        outcome:
          type: string
          const: exit_recorded
        full_name:
          type: string
        room_label:
          type: string
        message:
          type: string
        outing:
          $ref: "#/components/schemas/ScanExitOuting"

    ScanReturnResult:
      type: object
      additionalProperties: false
      required: [outcome, full_name, room_label, message, return_record]
      properties:
        outcome:
          type: string
          const: return_recorded
        full_name:
          type: string
        room_label:
          type: string
        message:
          type: string
        return_record:
          $ref: "#/components/schemas/ScanReturnRecord"
          description: |
            Nested return payload. Named `return_record` (not `return`) so
            OpenAPI and Python clients avoid the reserved word.

    ScanResult:
      oneOf:
        - $ref: "#/components/schemas/ScanExitResult"
        - $ref: "#/components/schemas/ScanReturnResult"
      discriminator:
        propertyName: outcome
        mapping:
          exit_recorded: "#/components/schemas/ScanExitResult"
          return_recorded: "#/components/schemas/ScanReturnResult"
      description: |
        Discriminated union on `outcome`. Shared envelope fields are only
        `outcome`, `full_name`, `room_label`, and `message`. Variant nests are
        mutually exclusive: `outing` on exit, `return_record` on return.
        `recorded_at` lives inside each nest, not on the envelope. No boolean
        timeliness fields: return uses `return_record.return_timeliness`
        (`on_time` | `within_grace` | `late`). Exit outing includes `lateness`
        and omits `return_timeliness`.

    GateActivityItem:
      type: object
      additionalProperties: false
      description: |
        One gate activity line. Always has `event` and `occurred_at`. The five
        name/room fields are always present and nullable. Invariant: for
        `exit` or `return`, `resident_name` and `room_label` are strings and
        `guest_name`, `host_name`, and `host_room_label` are null. For
        `guest_arrival` or `guest_departure`, `guest_name`, `host_name`, and
        `host_room_label` are strings and `resident_name` and `room_label`
        are null.
      required: [event, occurred_at, resident_name, room_label, guest_name, host_name, host_room_label]
      properties:
        event:
          type: string
          enum: [exit, return, guest_arrival, guest_departure]
          description: What the gate recorded.
        occurred_at:
          type: string
          format: date-time
        resident_name:
          oneOf:
            - type: string
            - type: "null"
          description: Resident display name for exit/return. Null for guest lines.
        room_label:
          oneOf:
            - type: string
            - type: "null"
          description: Resident room label for exit/return. Null for guest lines.
        guest_name:
          oneOf:
            - type: string
            - type: "null"
          description: Guest display name for guest arrival/departure. Null for resident lines.
        host_name:
          oneOf:
            - type: string
            - type: "null"
          description: Host resident display name for guest lines. Null for resident lines.
        host_room_label:
          oneOf:
            - type: string
            - type: "null"
          description: Host room label for guest lines. Null for resident lines.

    GateActivityPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GateActivityItem"


    GateOccupancy:
      type: object
      additionalProperties: false
      required: [guests_in_hall_count, guests_should_have_left_count]
      properties:
        guests_in_hall_count:
          type: integer
          minimum: 0
          description: |
            Dining count: arrived_at IS NOT NULL AND departed_at IS NULL
            (includes should-have-left).
        guests_should_have_left_count:
          type: integer
          minimum: 0
          description: |
            Subset of dining where the hall date is after guest_end_date.

    GateGuestCard:
      type: object
      additionalProperties: false
      required: [id, guest_name, host_name, host_room_label, guest_start_date, guest_end_date, payment_status, bucket]
      properties:
        id:
          type: string
          format: uuid
        guest_name:
          type: string
        host_name:
          type: string
        host_room_label:
          type: string
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        payment_status:
          type: string
          enum: [paid, unpaid]
        bucket:
          $ref: "#/components/schemas/GuestBucket"

    GateGuestList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GateGuestCard"
        total:
          type: integer
          minimum: 0
          description: Guests that match the bucket, payment filter, and search. Not the page length.
        limit:
          type: integer
          minimum: 1
          maximum: 500
        offset:
          type: integer
          minimum: 0

    GuestArrivalResult:
      type: object
      additionalProperties: false
      description: |
        Gate flash after recording arrival. Human labels for the screen.
        `arrival_time` and `recorded_at` are distinct field names but must be
        equal: both are the same server UTC instant written to `arrived_at` and
        the audit/write timestamp. No client-supplied time in this release.
      required: [guest_name, host_name, host_room_label, recorded_at, recorded_by, arrival_time, message]
      properties:
        guest_name:
          type: string
        host_name:
          type: string
        host_room_label:
          type: string
        recorded_at:
          type: string
          format: date-time
          description: When the API wrote the arrival record and audit entry.
        recorded_by:
          type: string
          description: Full display name of the staff member who recorded the arrival.
        arrival_time:
          type: string
          format: date-time
          description: |
            When the guest entered the hall (stored `arrived_at`).
            Must equal `recorded_at` (same clock tick; no independent second timestamp).
        message:
          type: string

    GuestDepartureResult:
      type: object
      additionalProperties: false
      description: |
        Gate flash after recording departure. Human labels for the screen.
        `departure_time` and `recorded_at` are distinct field names but must be
        equal: both are the same server UTC instant written to `departed_at` and
        the audit/write timestamp. No client-supplied time in this release.
      required: [guest_name, host_name, host_room_label, recorded_at, recorded_by, departure_time, message]
      properties:
        guest_name:
          type: string
        host_name:
          type: string
        host_room_label:
          type: string
        recorded_at:
          type: string
          format: date-time
          description: When the API wrote the departure record and audit entry.
        recorded_by:
          type: string
          description: Full display name of the staff member who recorded the departure.
        departure_time:
          type: string
          format: date-time
          description: |
            When the guest left the hall (stored `departed_at`).
            Must equal `recorded_at` (same clock tick; no independent second timestamp).
        message:
          type: string

    RegisterSummary:
      type: object
      additionalProperties: false
      required:
        - inside_count
        - outside_count
        - late_count
        - pending_permission_count
        - guests_in_hall_count
        - guests_should_have_left_count
        - pending_guest_stay_count
        - blocks
        - notifications_unread
        - notifications_unread_count
      properties:
        inside_count:
          type: integer
        outside_count:
          type: integer
        late_count:
          type: integer
        pending_permission_count:
          type: integer
        guests_in_hall_count:
          type: integer
        guests_should_have_left_count:
          type: integer
        pending_guest_stay_count:
          type: integer
        blocks:
          type: array
          description: The same counts for each block. Hall totals are the sum of these rows.
          items:
            $ref: "#/components/schemas/BlockRegisterCounts"
        notifications_unread:
          type: boolean
          description: True when `notifications_unread_count` is above zero.
        notifications_unread_count:
          type: integer
          minimum: 0
          description: Events unread by the caller, any age. Use it for the bell and the app badge.

    BlockRegisterCounts:
      type: object
      additionalProperties: false
      required:
        - block_id
        - code
        - name
        - inside_count
        - outside_count
        - late_count
        - pending_permission_count
        - guests_in_hall_count
        - guests_should_have_left_count
        - pending_guest_stay_count
      properties:
        block_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        inside_count:
          type: integer
        outside_count:
          type: integer
        late_count:
          type: integer
        pending_permission_count:
          type: integer
        guests_in_hall_count:
          type: integer
        guests_should_have_left_count:
          type: integer
        pending_guest_stay_count:
          type: integer

    RegisterRow:
      type: object
      additionalProperties: false
      required: [id, full_name, room_label, block_name, presence, state]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        room_label:
          type: string
        block_name:
          type: string
          description: Block of her current room.
        presence:
          $ref: "#/components/schemas/Presence"
        state:
          $ref: "#/components/schemas/RegisterState"
        outing_type:
          oneOf:
            - $ref: "#/components/schemas/OutingSource"
            - type: "null"
          description: Source of the open outing. Null when she is inside.
        outside_destination:
          oneOf:
            - type: string
            - type: "null"
          description: Place on the open outing. Empty when the resident is inside.
        expected_return_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    RegisterPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RegisterRow"

    GuardianNotice:
      type: string
      enum: [not_due, sent, failed]
      description: Whether the guardian has been told about the open outing.

    ResidentRecord:
      type: object
      additionalProperties: false
      required: [id, full_name, enrolment_number, room_label, presence, state, guardian_name, guardian_notice]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        enrolment_number:
          type: string
        course:
          oneOf:
            - type: string
            - type: "null"
        room_label:
          type: string
        presence:
          $ref: "#/components/schemas/Presence"
        state:
          $ref: "#/components/schemas/RegisterState"
        outing:
          oneOf:
            - $ref: "#/components/schemas/Outing"
            - type: "null"
          description: >
            The open outing with status outside, or null when the resident is
            inside. Cancelled, returned, and planned outings are omitted.
        guardian_name:
          type: string
          description: Parent or guardian the hall contacts.
        guardian_notice:
          $ref: "#/components/schemas/GuardianNotice"

    ResidentAccount:
      type: object
      additionalProperties: false
      required: [id, full_name, enrolment_number, room_id, room_label, guardian_name, guardian_phone, status, presence]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        enrolment_number:
          type: string
        course:
          oneOf:
            - type: string
            - type: "null"
        room_id:
          type: string
          format: uuid
        room_label:
          type: string
        phone:
          oneOf:
            - type: string
            - type: "null"
          description: >
            The resident's own phone in E.164 with country code. Empty when the
            hall has not entered it. Optional; not the guardian phone.
          example: "+919811112222"
        guardian_name:
          type: string
        guardian_phone:
          type: string
          description: E.164, country code required.
        status:
          $ref: "#/components/schemas/AccountStatus"
        presence:
          $ref: "#/components/schemas/Presence"
          description: Inside or outside the hall. Changes when a gate scan records an exit or a return. This is not sign-in.

    ResidentAccountPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResidentAccount"

    ResidentCreate:
      type: object
      additionalProperties: false
      required: [full_name, enrolment_number, room_id, phone, guardian_name, guardian_phone, temporary_password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        enrolment_number:
          type: string
          minLength: 1
          maxLength: 40
        course:
          type: string
          maxLength: 120
        room_id:
          type: string
          format: uuid
        phone:
          type: string
          description: >
            The resident's own phone in E.164 with country code. Required on
            office create. Not the guardian phone.
          pattern: "^\\+[1-9][0-9]{7,14}$"
          example: "+919811112222"
        guardian_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Parent or guardian. Required.
        guardian_phone:
          type: string
          description: E.164 with country code, for example +919876543210.
          pattern: "^\\+[1-9][0-9]{7,14}$"
        temporary_password:
          type: string
          minLength: 10
          maxLength: 200

    ResidentCreated:
      type: object
      additionalProperties: false
      required: [account, hall_pass]
      properties:
        account:
          $ref: "#/components/schemas/ResidentAccount"
        hall_pass:
          $ref: "#/components/schemas/HallPass"

    ResidentUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        enrolment_number:
          type: string
          minLength: 1
          maxLength: 40
        course:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
        room_id:
          type: string
          format: uuid
        phone:
          oneOf:
            - type: string
              pattern: "^\\+[1-9][0-9]{7,14}$"
            - type: "null"
          description: >
            The resident's own phone. Set to null to clear. Same E.164 pattern
            as guardian_phone when present.
          example: "+919811112222"
        guardian_name:
          type: string
          minLength: 1
          maxLength: 120
        guardian_phone:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
        status:
          $ref: "#/components/schemas/AccountStatus"

    StaffAccount:
      type: object
      additionalProperties: false
      required: [id, full_name, username, role, job_title, status]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        job_title:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"

    StaffPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StaffAccount"

    StaffCreate:
      type: object
      additionalProperties: false
      required: [full_name, username, role, job_title, temporary_password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: "#/components/schemas/StaffRole"
        job_title:
          type: string
          minLength: 1
          maxLength: 80
          description: Name of the post. Gate staff scan. The provost approves requests and keeps hall records.
        temporary_password:
          type: string
          minLength: 10
          maxLength: 200

    StaffUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        job_title:
          type: string
          minLength: 1
          maxLength: 80
        status:
          $ref: "#/components/schemas/AccountStatus"

    Block:
      type: object
      additionalProperties: false
      required: [id, code, name, floors, room_count, beds_per_room, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Short code used in room labels. Utility has no letter on the hall page, so its code is Utility.
        name:
          type: string
        floors:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: A, B, C, and D have 4. The hall page does not state a floor count for Utility.
        room_count:
          type: integer
          description: Published room count for this block. Block-A 50, Block-B 58, Block-C 42, Block-D 40, Utility 16.
        beds_per_room:
          type: integer
          description: The hall page states a room capacity of 2.
        status:
          type: string
          enum: [active, inactive]
          description: "`active` while the hall uses this block. `inactive` when retired."

    BlockCreate:
      type: object
      additionalProperties: false
      required: [code, name, room_count, beds_per_room]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 80
        floors:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 20
            - type: "null"
        room_count:
          type: integer
          minimum: 1
          maximum: 500
        beds_per_room:
          type: integer
          minimum: 1
          maximum: 6

    BlockUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        floors:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 20
            - type: "null"
        room_count:
          type: integer
          minimum: 1
          maximum: 500
        beds_per_room:
          type: integer
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [active, inactive]

    Room:
      type: object
      additionalProperties: false
      required: [id, block_id, number, label, bed_count, status]
      properties:
        id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
        number:
          type: string
          description: Door number, kept as written. The hall page does not publish door numbers.
        label:
          type: string
          example: B-204
        bed_count:
          type: integer
          description: Copied from the block when the room is created. Active residents assigned here, including a suspended resident who has not moved, cannot exceed this.
        status:
          type: string
          enum: [active, inactive]
          description: "`active` while the room can be assigned. `inactive` when retired."

    RoomCreate:
      type: object
      additionalProperties: false
      required: [block_id, number]
      properties:
        block_id:
          type: string
          format: uuid
        number:
          type: string
          minLength: 1
          maxLength: 12

    RoomUpdate:
      type: object
      additionalProperties: false
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 12
        bed_count:
          type: integer
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [active, inactive]

    HallSettings:
      type: object
      additionalProperties: false
      required:
        - hall_name
        - university_name
        - timezone
        - grace_minutes
        - summer_outing_start
        - summer_outing_end
        - winter_outing_start
        - winter_outing_end
        - summer_season_start
        - winter_season_start
        - permission_lead_minutes
        - guest_max_inclusive_days
        - guest_min_lead_days
        - scan_duplicate_window_seconds
      properties:
        hall_name:
          type: string
        university_name:
          type: string
        timezone:
          type: string
          example: Asia/Kolkata
        grace_minutes:
          type: integer
        summer_outing_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Ordinary outing window start (summer). Kept as HH:MM. Shown as 6:00 AM. Starts as 06:00.
          example: "06:00"
        summer_outing_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Ordinary outing window end (summer). Kept as HH:MM. Shown as 6:30 PM. Starts as 18:30.
          example: "18:30"
        winter_outing_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Ordinary outing window start (winter). Same as summer for now. Starts as 06:00.
          example: "06:00"
        winter_outing_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Ordinary outing window end (winter). Same as summer for now. Starts as 18:30.
          example: "18:30"
        summer_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          description: Month and day the summer ordinary outing window begins. Shown as 01 April. Starts as 04-01.
          example: "04-01"
        winter_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          description: Month and day the winter ordinary outing window begins. Shown as 01 October. Starts as 10-01.
          example: "10-01"
        permission_lead_minutes:
          type: integer
          description: Minutes before a permission start when a resident may leave. Aligns with guest_min_lead_days naming.
        guest_max_inclusive_days:
          type: integer
        guest_min_lead_days:
          type: integer
        scan_duplicate_window_seconds:
          type: integer

    HallSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        hall_name:
          type: string
          minLength: 1
          maxLength: 160
        university_name:
          type: string
          minLength: 1
          maxLength: 160
        grace_minutes:
          type: integer
          minimum: 0
          maximum: 180
        summer_outing_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        summer_outing_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        winter_outing_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        winter_outing_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        summer_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
        winter_season_start:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
        permission_lead_minutes:
          type: integer
          minimum: 0
          maximum: 180
        guest_max_inclusive_days:
          type: integer
          minimum: 1
          maximum: 30
        guest_min_lead_days:
          type: integer
          minimum: 0
          maximum: 14
        scan_duplicate_window_seconds:
          type: integer
          minimum: 0
          maximum: 600

    HallNotifications:
      type: object
      additionalProperties: false
      required:
        - late_sms_template
        - return_sms_template
      properties:
        late_sms_template:
          type: string
          description: "Placeholders: {resident_name}, {room}, {expected_return_local}, {hall_name}."
        return_sms_template:
          type: string
          description: "Placeholders: {resident_name}, {room}, {returned_at_local}, {hall_name}."

    HallNotificationsUpdate:
      type: object
      additionalProperties: false
      properties:
        late_sms_template:
          type: string
          minLength: 1
        return_sms_template:
          type: string
          minLength: 1

    SmsMessage:
      type: object
      additionalProperties: false
      description: |
        Provost SMS log row. Transport vendor is not part of the public contract.
      required: [id, outing_id, resident_id, notice_type, recipient_phone, body, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        outing_id:
          type: string
          format: uuid
        resident_id:
          type: string
          format: uuid
        resident_name:
          type: string
        notice_type:
          type: string
          enum: [late_notice, return_notice]
          description: Late notice, or return notice.
        recipient_phone:
          type: string
          description: Guardian phone copied at send time. Country code required.
          pattern: "^\\+[1-9][0-9]{7,14}$"
        body:
          type: string
          description: Filled message. Times are described for display as 12-hour; this body is the text that was sent.
        status:
          type: string
          enum: [sent, failed]
        created_at:
          type: string
          format: date-time

    SmsPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SmsMessage"

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, action, entity_type, entity_id, summary]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_user_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        actor_name:
          oneOf:
            - type: string
            - type: "null"
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        summary:
          type: string

    AuditPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
