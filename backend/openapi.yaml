        outing_id:
          type: string
          format: uuid

    HistoryPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/HistoryEvent"

    Destination:
      type: object
      additionalProperties: false
      required: [id, name, is_other, is_active]
      properties:
