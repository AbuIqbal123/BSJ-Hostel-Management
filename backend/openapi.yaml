          format: uuid
        guest_name:
          type: string
        host_name:
          type: string
        host_room_label:
          type: string
        guest_start_date:
          type: string
          format: date
        guest_end_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, approved, rejected, cancelled, departed]
        payment_status:
          type: string
          enum: [unpaid, paid]
        bucket:
          $ref: "#/components/schemas/GuestBucket"

    GuestStayPage:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GuestStaySummary"

    PaymentRequest:
      type: object
      additionalProperties: false
      required: [payment_status]
      description: |
        Marks guest-stay payment that happened outside the system. `payment_note`
