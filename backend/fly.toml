# Dev hall API on Fly in Singapore (sin), beside Turso aws-ap-southeast-1.
# App name and Turso DB include -dev so they are not mistaken for production.
# Mumbai (bom) no longer accepts new Machines. Deploy from backend/: fly deploy
# Org: Abu Baker Iqbal (slug personal).

app = "bsj-hostel-api-dev"
primary_region = "sin"
org = "personal"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Dev only: stop when idle (overnight when testers are away), start on the
  # next request. A continuous machine health check would keep it awake, so
  # that check is omitted here; deploy still smoke-checks the Machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
