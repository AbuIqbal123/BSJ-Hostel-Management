# Hall API on Fly in Singapore (sin), beside Turso aws-ap-southeast-1.
# Mumbai (bom) no longer accepts new Machines. Deploy from backend/: fly deploy
# Org: Abu Baker Iqbal (slug personal).

app = "bsj-hostel-api"
primary_region = "sin"
org = "personal"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
